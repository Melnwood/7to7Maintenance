<script>
const OFFICES_FALLBACK=['Alamo Ranch','Braun','Bulverde','Cibolo','Forum','Leon Springs','Mission Oaks','Potranco','Sahota','Singing Hills','Stone Oak','TPC'];
let officeNames=OFFICES_FALLBACK.slice();
let assets=[], life=[], lifeMap={};
let officeData=[];
let poData=[];
const CREW=['Adrian Ellenwood','Grumpy'];
let crew=CREW.slice();
let peopleData=[];
const STATUSES=['New','In progress','Pending','Part ordered','Fixed'];
const FLOW=['New','In progress','Pending','Part ordered'];
const PRILABEL={high:'High',medium:'Medium',low:'Low'};
const API='/.netlify/functions/airtable';
const $=s=>document.querySelector(s);
const rank={high:0,medium:1,low:2,'':3};
const MS=86400000;
const LAUNCH='2026-07-01'; // speed metric counts requests reported on/after this date (excludes pre-launch backfills)
let issues=[], log=[], parts=[], tab='board', filter='', selOffice=null, sortMode='priority';
let pendingPhotos=[];   // several photos can ride on one work-log entry
let whMode='order', whSearch='';
let invMode='parts', assetSearch='', assetDrill='';
let timelog=[], reportPane=null, lastWorker='';
let openSecs={'__replacesoon':true,'__clock':true};
let boardMode='status';
let dismissed={}, showDupes=false, showOfficeDupes=false;

function toast(t,actionLabel,actionFn){const e=$('#toast');e.innerHTML='';e.appendChild(document.createTextNode(t));
  if(actionLabel&&actionFn){const b=document.createElement('span');b.className='toast-act';b.textContent=actionLabel;b.onclick=()=>{e.classList.remove('show');actionFn();};e.appendChild(b);}
  e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),actionLabel?4500:1900);}
function dObj(s){ if(!s) return null; const x=new Date(s+'T00:00'); return isNaN(x)?null:x; }
function today0(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function daysAgo(s){ const d=dObj(s); return d?Math.round((today0()-d)/MS):null; }
function fmt(s){ const d=dObj(s); return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''; }
function ageStr(n){ if(n==null) return ''; if(n<=0) return 'today'; return n+'d'; }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cleanNote(t){ return String(t==null?'':t).replace(/\s*\[dupe-key:[^\]]+\]/,'').trim(); }
function isOpen(i){ return i.status!=='Fixed'; }
function byOldest(a,b){ return (daysAgo(b.date)||0)-(daysAgo(a.date)||0); }

function normChair(s){ return String(s||'').toLowerCase()
  .replace(/\b(rooms?|rm)\b/g,'rm').replace(/\b(operatory|ops?)\b/g,'op').replace(/\b(hygiene|hyg|h)\b/g,'hyg')
  .replace(/[^a-z0-9]/g,''); }
function clustersIn(list){
  const groups={};
  list.filter(isOpen).forEach(i=>{ const nc=normChair(i.chair); if(!nc) return; const k=i.office+'|'+nc; (groups[k]=groups[k]||[]).push(i); });
  return Object.keys(groups).map(k=>groups[k]).filter(g=>g.length>=2 && !dismissed[g.map(x=>x.id).sort().join(',')]);
}

const PASSCODE='7to7crew';    // full access (Adrian & crew)
const VIEWCODE='7to7bosses';    // view-only (bosses) — can look around, can't change anything
let READONLY=false;
function ccRole(){ try{ return localStorage.getItem('cc_role')||''; }catch(e){ return ''; } }
function ccUnlocked(){ const r=ccRole(); return r==='crew'||r==='viewer'; }
function applyRole(){ READONLY=(ccRole()==='viewer'); try{ document.body.classList.toggle('ro',READONLY); }catch(e){} }
function ccLogout(){ try{ localStorage.removeItem('cc_role'); localStorage.removeItem('cc_unlocked'); }catch(e){} location.reload(); }
function tryUnlock(){ const inp=document.getElementById('gatecode'), err=document.getElementById('gateerr');
  const v=(inp.value||'').trim(); let role=''; if(v===PASSCODE) role='crew'; else if(v===VIEWCODE) role='viewer';
  if(role){ try{ localStorage.setItem('cc_role',role); }catch(e){} applyRole();
    document.getElementById('gate').classList.add('hide'); load(); }
  else { err.textContent='That code isn\u2019t right. Try again.'; inp.value='';
    const c=document.querySelector('.gatecard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); inp.focus(); } }
function openGate(){ const inp=document.getElementById('gatecode');
  document.getElementById('gatebtn').onclick=tryUnlock;
  inp.onkeydown=(e)=>{ if(e.key==='Enter') tryUnlock(); };
  setTimeout(()=>inp&&inp.focus(),60); }
// Bulletproof view-only guard: block every write (POST) to the backend when a boss is signed in.
(function(){ const _f=window.fetch.bind(window);
  window.fetch=function(url,opts){
    if(READONLY && opts && String(opts.method||'').toUpperCase()==='POST'){
      try{ toast('View-only mode — changes are turned off'); }catch(e){}
      return Promise.resolve(new Response(JSON.stringify({ok:false,error:'View-only mode — changes are turned off.'}),{status:200,headers:{'Content-Type':'application/json'}}));
    }
    return _f(url,opts);
  };
})();
const _gl=document.getElementById('gatelogo'); const _hl=document.querySelector('header .logo img');
if(_gl&&_hl) _gl.src=_hl.src;
try{ if(localStorage.getItem('cc_unlocked')==='1' && !ccRole()){ localStorage.setItem('cc_role','crew'); } }catch(e){} // migrate existing crew logins
applyRole();
if(ccUnlocked()){ document.getElementById('gate').classList.add('hide'); load(); }
else { openGate(); }
async function load(){
  try{ const r=await fetch(API); const d=await r.json(); if(d.error) throw new Error(d.error);
    issues=d.issues||[]; log=d.worklog||[]; parts=d.parts||[]; assets=d.assets||[];
    timelog=d.timelog||[];
    life=d.life||[]; lifeMap=Object.assign({},LIFE_DEFAULT);
    life.forEach(r=>{ if(r&&r.category&&typeof r.years==='number'&&!isNaN(r.years)) lifeMap[r.category]=r.years; });
    const ppl=(d.people||[]).filter(p=>p&&p.active&&p.name).map(p=>p.name);
    crew = ppl.length? ppl : CREW.slice();
    peopleData = d.people||[];
    // Rebuild "not a duplicate" decisions from the Work Log so they persist across reloads/redeploys.
    dismissed={};
    log.forEach(l=>{ const m=/\[dupe-key:([^\]]+)\]/.exec(l.note||''); if(m) dismissed[m[1]]=true; });
    officeNames=(d.officeList&&d.officeList.length)?d.officeList.slice():OFFICES_FALLBACK.slice();
    officeData=d.offices||[];
    poData=d.purchaseorders||[];
    render();
  }catch(e){ $('#wrap').innerHTML='<div class="empty">Could not load.<br><span class="muted">'+esc(e.message||'')+'</span></div>'; }
}
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; showDupes=false; selOffice=null; showOfficeDupes=false; assetDrill=''; reportPane=null;
  $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
document.getElementById('clk-in').onclick=clockInTapped;
document.getElementById('clk-out').onclick=clockOutTapped;

function render(){
  try{
    const open=issues.filter(isOpen);
    const partsWait=open.filter(i=>i.status==='Part ordered');
    $('#sub').textContent=open.length+' open'+(partsWait.length?' · '+partsWait.length+' on parts':'');
    let body='';
    if(tab==='board') body=viewBoard(open);
    else if(tab==='recent') body=viewRecent();
    else if(tab==='manage') body=reportPane?viewReportPane():viewManage();
    else if(tab==='warehouse') body=viewInventory();
    else body=viewOffices();
    $('#wrap').innerHTML=body; wire(); updateClockBar();
  }catch(e){ $('#wrap').innerHTML='<div class="empty">Something went wrong drawing this view.<br><span class="muted">'+esc(e.message||'')+'</span></div>'; }
}

function statTile(key,n,label,cls){ return '<div class="stat'+(filter===key?' on':'')+(cls?' '+cls:'')+'" data-f="'+key+'"><b>'+n+'</b><span>'+label+'</span></div>'; }

function viewBoard(open){
  const partsWait=open.filter(i=>i.status==='Part ordered');
  const dupes=clustersIn(issues); let dupeCount=0; dupes.forEach(g=>dupeCount+=g.length);
  let h='<div class="stats">'+
    statTile('open',open.length,'Open')+
    statTile('parts',partsWait.length,'Waiting on parts','parts')+
    statTile('dupes',dupeCount,'Duplicates','dupe')+'</div>';
  if(filter==='parts') return h+partsWindow(partsWait);
  if(filter==='dupes') return h+(dupeCount?dupeSection(dupes,'across all offices'):'<div class="empty">No duplicates right now. 👍</div>');
  if(filter==='open') return h+boardModeToggle()+stackBoard(open);
  // default home command-center
  h+='<div class="twowin">'+attentionLine(open)+crewSpeedCard()+'</div>';
  h+=officeRankWindow(open);
  h+='<div class="secthead" style="margin-top:16px">All requests · across every office</div>';
  h+=boardModeToggle()+stackBoard(open);
  return h;
}

// collapsible "which office needs the most work" window

  const byOff={}; open.forEach(i=>{ if(i.office) byOff[i.office]=(byOff[i.office]||0)+1; });
  const rows=Object.keys(byOff).map(o=>({o:o,n:byOff[o]})).sort((a,b)=>b.n-a.n);
  const isOpen=!!openSecs['__officerank'];
  const top=rows.length?rows[0]:null;
  let h='<div class="sec'+(isOpen?'':' col')+'" style="margin-top:14px">'+
    '<div class="sechead" data-sec="__officerank"><span class="cw s-rank"></span>'+
    '<span class="snm">Which office needs the most work</span>'+
    '<span class="sct">'+(top?esc(top.o)+' · '+top.n:'0')+'</span><span class="cv">▾</span></div>'+
    '<div class="cards">';
  if(!rows.length){ h+='<div class="none">No open requests anywhere. 🎉</div>'; }
  else { const max=rows[0].n;
    h+='<div class="panel" style="margin-top:2px">';
    rows.forEach((r,idx)=>{ const pct=Math.max(Math.round(r.n/max*100),8);

    });

// requests that EVER went to "Part ordered" (so we can exclude them from crew speed)
function everWaitedOnParts(id){
  if(everWaitedOnParts._c && everWaitedOnParts._c[id]!==undefined) return everWaitedOnParts._c[id];
  return false;
}
function buildPartsHistory(){
  const ever={}, orderedOn={};
  log.forEach(l=>{ if(/part ordered/i.test(l.note||'')){ ever[l.issueId]=true;
    if(l.date && (!orderedOn[l.issueId] || (dObj(l.date)&&dObj(orderedOn[l.issueId])&&dObj(l.date)>dObj(orderedOn[l.issueId])))) orderedOn[l.issueId]=l.date; } });
  everWaitedOnParts._c=ever; buildPartsHistory._ordered=orderedOn;
}

function crewSpeedCard(){
  buildPartsHistory();
  const now=today0(); const c90=new Date(now); c90.setDate(c90.getDate()-90);
  const launch=dObj(LAUNCH); const cutoff=(launch && c90<launch)?launch:c90;  // rolling 90 days, never before July 1
  let days=[];
  issues.forEach(i=>{
    if(i.status!=='Fixed' || !i.fixed || !i.date) return;
    const fx=dObj(i.fixed), rp=dObj(i.date); if(!fx||!rp) return;
    if(rp<cutoff) return;                        // reported since July 1 (then rolling 90 days)
    if(everWaitedOnParts(i.id)) return;          // parts-waiters don't count
    const d=Math.round((fx-rp)/MS); if(d>=0) days.push(d);
  });
  if(!days.length) return '<div class="speedcard empty2"><b>—</b><span>No fixed requests yet to measure crew speed.<br><span class="sub2">This fills in as jobs get marked fixed.</span></span></div>';
  const avg=days.reduce((a,b)=>a+b,0)/days.length;
  const txt=avg<1?'< 1 day':(avg.toFixed(avg<10?1:0)+(avg<2?' day':' days'));
  return '<div class="speedcard"><b>'+txt+'</b><span>Average time to fix · last 90 days (from Jul 1)<br>'+
    '<span class="sub2">parts-waiting jobs not counted · '+days.length+' job'+(days.length===1?'':'s')+'</span></span></div>';
}

function attentionLine(open){
  const actionable=open.filter(i=>i.status!=='Part ordered');
  if(!actionable.length) return '<div class="attn calm"><span class="ico">✓</span><span class="t">All caught up — nothing aging that needs attention.</span></div>';
  let oldest=null, oldestAge=-1;
  actionable.forEach(i=>{ const a=daysAgo(i.date); if(a!=null && a>oldestAge){ oldestAge=a; oldest=i; } });
  if(!oldest) return '';
  return '<div class="attn" data-id="'+oldest.id+'"><span class="ico">⏱️</span><span class="t">Needs attention: <b>'+
    esc(oldest.office)+(oldest.chair?' — '+esc(oldest.chair):'')+'</b>, open <b>'+ageStr(oldestAge)+'</b>'+
    '<span class="sm">Oldest request that\u2019s not waiting on parts</span></span></div>';
}

function latestNoteFor(id){
  let best='', bd=null;
  log.forEach(l=>{ if(l.issueId===id && l.note && !/^\(same job\)/i.test(l.note) && !/^status changed/i.test(l.note) && !/\[dupe-key:/.test(l.note)){
    const d=dObj(l.date); if(!bd||(d&&d>=bd)){ bd=d; best=l.note; } } });
  return best;
}

function partsWindow(list){
  if(!list.length) return '<div class="empty">Nothing is waiting on parts right now. 👍</div>';
  buildPartsHistory(); const orderedOn=buildPartsHistory._ordered||{};
  const rows=list.map(i=>{ const od=orderedOn[i.id]||i.date; const w=daysAgo(od); return {i:i, wait:(w==null?0:w)}; })
                 .sort((a,b)=>b.wait-a.wait);
  const longest=rows[0].wait; const over2wk=rows.filter(r=>r.wait>14).length;
  let h='<div class="pstrip">'+list.length+' waiting on parts · longest <b>'+longest+'d</b>'+(over2wk?(' · <b>'+over2wk+'</b> over 2 weeks'):'')+'</div>';
  h+='<div class="pnote">Tip: tap a request to add an update (e.g. \u201cpart backordered\u201d) — the office sees it on their screen. A list of which part types take longest will build here as you order parts in the app.</div>';
  h+='<div class="secthead">Waiting on parts · longest first</div><div class="panel">';
  rows.forEach(r=>{ const latest=latestNoteFor(r.i.id);
    h+='<div class="prow2" data-id="'+r.i.id+'"><div class="pl"><div class="pn">'+esc(r.i.office)+(r.i.chair?' — '+esc(r.i.chair):'')+'</div>'+
       '<div class="pm">'+esc((r.i.problem||'').slice(0,70))+(latest?' · '+esc(latest.slice(0,40)):'')+'</div></div>'+
       '<div class="po"><b>'+r.wait+'d</b></div></div>';
  });
  h+='</div>';
  return h;
}

function dupeSection(clusters,scope){
  if(!clusters.length) return '<div class="empty">No possible duplicates '+esc(scope)+'. 👍</div>';
  let h='<div class="muted" style="margin-bottom:10px">Same office &amp; same chair/area, both still open. Open one to resolve, or dismiss if they are really different.</div>';
  clusters.forEach(g=>{ const key=g.map(x=>x.id).sort().join(',');
    h+='<div class="dupwrap"><div class="h">'+esc(g[0].office)+' · '+esc(g[0].chair)+' — '+g.length+' open reports</div>';
    g.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(i=>h+=dupRow(i));
    h+='<button class="ghost-btn" data-dismiss="'+key+'">Not duplicates — dismiss</button></div>'; });
  return h;
}
function dupRow(i){ const n=daysAgo(i.date);
  return '<div class="r" data-id="'+i.id+'"><span class="dot '+(i.impact||'')+'"></span>'+
    '<span class="loc">'+esc(i.chair||'—')+'</span><span class="pr">'+esc(i.problem)+'</span>'+
    '<span class="ag">'+ageStr(n)+'</span></div>'; }

function inRangeStr(d,from,to){ if(!d) return false; d=String(d).slice(0,10); if(from&&d<from) return false; if(to&&d>to) return false; return true; }
function lastWorkFor(id){ const ws=log.filter(w=>w.issueId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let note='',who='',parts='';
  ws.forEach(w=>{ if(!who&&w.who) who=w.who; if(!parts&&w.partNumber) parts=w.partNumber+(w.qty?(' ×'+w.qty):''); });
  for(let k=0;k<ws.length;k++){ const n=cleanNote(ws[k].note); if(n && !/^(Status changed to|Priority changed to|Reviewed —|Duplicate of)/.test(n)){ note=n; break; } }
  return {note:note,who:who,parts:parts}; }
function reportData(office,from,to,wantDone,wantOpen){
  const offOk=o=>(!office||office==='All')?true:(o===office);
  const completed = wantDone ? issues.filter(i=>offOk(i.office)&&i.status==='Fixed'&&inRangeStr(i.fixed||i.date,from,to)) : [];
  const open = wantOpen ? issues.filter(i=>offOk(i.office)&&i.status!=='Fixed') : [];
  return {completed:completed, open:open};
}
function reportCSV(office,from,to,wantDone,wantOpen){
  const r=reportData(office,from,to,wantDone,wantOpen);
  const head=['Section','Office','Chair/Area','Problem','What was done / status','Who','Parts','Reported','Fixed'];
  const lines=[head.map(csvCell).join(',')];
  r.completed.slice().sort((a,b)=>(a.office||'').localeCompare(b.office||'')||(b.fixed||'').localeCompare(a.fixed||'')).forEach(i=>{ const w=lastWorkFor(i.id);
    lines.push(['Completed',i.office,i.chair,i.problem,(w.note||i.history||''),w.who,w.parts,i.date,i.fixed].map(csvCell).join(',')); });
  r.open.slice().sort((a,b)=>(a.office||'').localeCompare(b.office||'')||(a.date||'').localeCompare(b.date||'')).forEach(i=>{ const w=lastWorkFor(i.id);
    lines.push(['Open',i.office,i.chair,i.problem,(i.status+(w.note?(' — '+w.note):'')),w.who,'',i.date,''].map(csvCell).join(',')); });
  return lines.join('\r\n');
}

// ---- Labor time ----
function fmtClock(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?'':d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function fmtDayT(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function durMin(s,e){ if(!s||!e) return null; const a=new Date(s),b=new Date(e); if(isNaN(a)||isNaN(b)) return null; const m=Math.round((b-a)/60000); return m>=0?m:null; }
function durLabel(m){ if(m==null) return '—'; const h=Math.floor(m/60), mm=m%60; return h? ((mm? (h+'h '+mm+'m') : (h+'h'))) : (mm+'m'); }
function timeData(office,from,to){
  const offOk=o=>(!office||office==='All')?true:(o===office);
  return timelog.filter(t=>t.start && offOk(t.office) && inRangeStr(String(t.start).slice(0,10),from,to))
    .slice().sort((a,b)=>(a.office||'').localeCompare(b.office||'')||String(a.start).localeCompare(String(b.start)));
}
function timeCSV(office,from,to){
  const rows=timeData(office,from,to);
  const head=['Date','Office','Who','Clock in','Clock out','Minutes','Duration'];
  const lines=[head.map(csvCell).join(',')];
  rows.forEach(t=>{ const m=durMin(t.start,t.end);
    lines.push([fmtDayT(t.start),t.office,t.who,fmtClock(t.start),fmtClock(t.end),(m==null?'':m),durLabel(m)].map(csvCell).join(',')); });
  return lines.join('\r\n');
}
function timeReportPrintHTML(office,from,to){
  const rows=timeData(office,from,to);
  let totMin=0, done=0; const byPerson={};
  rows.forEach(t=>{ const m=durMin(t.start,t.end); if(m!=null){ totMin+=m; done++; byPerson[t.who||'—']=(byPerson[t.who||'—']||0)+m; } });

function partsUsedRows(office,from,to){
  const offOk=o=>(!office||office==='All')?true:(o===office);
  const issById={}; issues.forEach(i=>{ issById[i.id]=i; });
  const pName={}, pCost={}; parts.forEach(p=>{ const n=String(p.number||'').trim(); pName[n]=p.name; pCost[n]=(typeof p.cost==='number'?p.cost:(p.cost!==''&&p.cost!=null&&!isNaN(Number(p.cost))?Number(p.cost):null)); });
  const rows=[];
  log.forEach(l=>{ const num=String(l.partNumber||'').trim(); const q=parseFloat(l.qty)||0;
    if(!num||q<=0) return;
    if(!inRangeStr(l.date,from,to)) return;
    const iss=issById[l.issueId]; const off=(iss&&iss.office)||'';
    if(!offOk(off)) return;
    rows.push({ office:off||'(no office)', chair:(iss&&iss.chair)||'', date:l.date||'', who:l.who||'',
      number:num, name:pName[num]||'', qty:q, cost:pCost[num], problem:(iss&&iss.problem)||'' }); });
  return rows.sort((a,b)=>(a.office||'').localeCompare(b.office||'')||(a.name||a.number).localeCompare(b.name||b.number)||(a.date||'').localeCompare(b.date||''));
}
function pcMoney(n){ return '$'+(Math.round((Number(n)||0)*100)/100).toLocaleString(); }
function partsUsedCSV(office,from,to){
  const rows=partsUsedRows(office,from,to);
  const head=['Office','Date','Chair/Area','Part number','Part','Qty used','Unit cost','Line cost','Who','Job'];
  const lines=[head.map(csvCell).join(',')];
  rows.forEach(r=>{ const c=(r.cost==null?'':r.cost); const lc=(r.cost==null?'':Math.round(r.qty*r.cost*100)/100);
    lines.push([r.office,r.date,r.chair,r.number,r.name,r.qty,c,lc,r.who,r.problem].map(csvCell).join(',')); });
  return lines.join('\r\n');

function partsUsedPrintHTML(office,from,to){
  const rows=partsUsedRows(office,from,to);
  const totQty=rows.reduce((a,b)=>a+(b.qty||0),0);

  const offsCovered={}, partsCovered={}; rows.forEach(r=>{ offsCovered[r.office]=true; partsCovered[r.number]=true; });
  let body='<div class="cards"><div class="kpi"><b>'+totQty+'</b><span>Parts used</span></div>'+
    '<div class="kpi"><b>'+Object.keys(partsCovered).length+'</b><span>Distinct parts</span></div>'+
    '<div class="kpi"><b>'+pcMoney(totCost)+'</b><span>Total cost</span></div></div>';
  if(!rows.length){ body+='<p class="empty">No parts were logged as used in this period.</p>'; return reportShell('Parts Usage',scopeLabel(office),rangeLabel(from,to),body); }
  // per office → part totals (with cost)
  const byO={}; rows.forEach(r=>{ (byO[r.office]=byO[r.office]||[]).push(r); });
  Object.keys(byO).sort().forEach(o=>{ const list=byO[o]; const agg={};
    list.forEach(r=>{ const a=agg[r.number]||(agg[r.number]={number:r.number,name:r.name,cost:r.cost,qty:0,times:0}); a.qty+=r.qty; a.times++; });
    let sub=0, subCost=0; Object.keys(agg).forEach(k=>{ sub+=agg[k].qty; if(agg[k].cost!=null) subCost+=agg[k].qty*agg[k].cost; });
    body+='<h3>'+esc(o)+' <span class="n">'+sub+' used · '+pcMoney(subCost)+'</span></h3><table class="pu"><thead><tr><th>Part</th><th>Part #</th><th>Qty</th><th>Unit cost</th><th>Cost</th></tr></thead><tbody>';
    Object.keys(agg).map(k=>agg[k]).sort((a,b)=>b.qty-a.qty||(a.name||'').localeCompare(b.name||'')).forEach(a=>{
      const lc=(a.cost!=null)?pcMoney(a.qty*a.cost):'—';
      body+='<tr><td>'+esc(a.name||'—')+'</td><td>'+esc(a.number)+'</td><td>'+a.qty+'</td><td>'+(a.cost!=null?pcMoney(a.cost):'—')+'</td><td>'+lc+'</td></tr>'; });
    body+='</tbody><tfoot><tr><td colspan="2">'+esc(o)+' total</td><td>'+sub+'</td><td></td><td>'+pcMoney(subCost)+'</td></tr></tfoot></table>'; });
  // overall totals by part — the reorder rollup with cost
  const all={}; rows.forEach(r=>{ const a=all[r.number]||(all[r.number]={number:r.number,name:r.name,cost:r.cost,qty:0}); a.qty+=r.qty; });
  body+='<h2>Totals by part'+((office&&office!=='All')?'':' (all offices)')+'</h2><table class="pu"><thead><tr><th>Part</th><th>Part #</th><th>Total qty</th><th>Unit cost</th><th>Total cost</th></tr></thead><tbody>';
  let grand=0;
  Object.keys(all).map(k=>all[k]).sort((a,b)=>b.qty-a.qty||(a.name||'').localeCompare(b.name||'')).forEach(a=>{
    const lc=(a.cost!=null)?a.qty*a.cost:null; if(lc!=null) grand+=lc;
    body+='<tr><td>'+esc(a.name||'—')+'</td><td>'+esc(a.number)+'</td><td>'+a.qty+'</td><td>'+(a.cost!=null?pcMoney(a.cost):'—')+'</td><td>'+(lc!=null?pcMoney(lc):'—')+'</td></tr>'; });
  body+='</tbody><tfoot><tr><td colspan="4">Grand total</td><td>'+pcMoney(grand)+'</td></tr></tfoot></table>';
  return reportShell('Parts Usage',scopeLabel(office),rangeLabel(from,to),body);

function poNumOr(v){ return (v===''||v==null||isNaN(Number(v)))?null:Number(v); }
function poLineCalc(p){
  const qty=poNumOr(p.qty)||0, rate=poNumOr(p.rate); const tr=poNumOr(p.taxRate);

const NSOFF={};                                       // no remap — NetSuite office = the full app name (e.g. "Alamo Ranch")

function nsDate(d){ const p=String(d||'').slice(0,10).split('-'); return (p.length===3)?((+p[1])+'/'+(+p[2])+'/'+p[0]):(d||''); } // 2026-06-10 -> 6/10/2026
function nsExtId(off,d){ const p=String(d||'').slice(0,10).split('-'); const c=(p.length===3)?(p[1]+p[2]+p[0]):''; return off+'1961'+(c?'-'+c:''); } // unique per office+date
function invAdjUsed(onlyNew){
  const issById={}; issues.forEach(i=>{ issById[i.id]=i; });
  const pName={}, pNS={}; parts.forEach(p=>{ const n=String(p.number||'').trim(); pName[n]=p.name; pNS[n]=p.netsuiteItem||''; });
  const out=[];
  log.forEach(l=>{ const num=String(l.partNumber||'').trim(); const q=parseFloat(l.qty)||0;

}
function invAdjGrouped(onlyNew){

function daysToFix(i){ const a=dObj(i.date), b=dObj(i.fixed); if(!a||!b) return null; const d=Math.round((b-a)/MS); return d>=0?d:null; }
function fmtDays(d){ if(d==null) return '—'; if(d<0.5) return 'same day'; const r=Math.round(d*10)/10; return r===1?'1 day':r+' days'; }
function speedWindow(){
  // rolling last 90 days, but never earlier than launch (July 1) so pre-launch backfills stay out
  const ninety=new Date(today0().getTime()-90*MS);
  const c90=ninety.getFullYear()+'-'+String(ninety.getMonth()+1).padStart(2,'0')+'-'+String(ninety.getDate()).padStart(2,'0');
  const cutoff=c90>LAUNCH?c90:LAUNCH;
  const done=issues.filter(i=>i.status==='Fixed' && i.date && i.fixed && String(i.date).slice(0,10)>=cutoff);
  const ds=done.map(daysToFix).filter(d=>d!=null);
  if(!ds.length) return nestSec('__speed','How fast we close requests','<span class="sct">no data yet</span>','<div class="none">This fills in as requests get marked Fixed.</div>');
  const avg=ds.reduce((a,b)=>a+b,0)/ds.length;
  const byO={}; done.forEach(i=>{ const d=daysToFix(i); if(d==null) return; (byO[i.office]=byO[i.office]||[]).push(d); });
  const rows=Object.keys(byO).map(o=>{ const arr=byO[o]; return {office:o, avg:arr.reduce((x,y)=>x+y,0)/arr.length, n:arr.length}; }).sort((a,b)=>a.avg-b.avg);
  let inner='<div class="hint">Average days from when a request comes in to when it\u2019s marked Fixed, over the last 90 days (starting July 1). Fastest office first.</div>';
  rows.forEach(r=>{ inner+='<div class="sprow"><span class="spo">'+esc(r.office)+'</span><b>'+fmtDays(r.avg)+'</b><i>'+r.n+' done</i></div>'; });
  return nestSec('__speed','How fast we close requests','<span class="sct">'+fmtDays(avg)+' avg</span>', inner);
}
function presenceToday(){
  const isToday=s=>{ const d=String(s||'').slice(0,10); return !!d && daysAgo(d)===0; };
  const here=timelog.filter(t=>t.start && !t.end).slice().sort((a,b)=>String(a.start).localeCompare(String(b.start)));
  const outToday=timelog.filter(t=>t.start && t.end && isToday(t.end)).slice().sort((a,b)=>String(b.end).localeCompare(String(a.end)));
  if(!here.length && !outToday.length) return '';
  let h='';
  if(here.length){
    h+='<div class="secthead">Clocked in now</div>';
    here.forEach(t=>{ const mins=durMin(t.start,new Date().toISOString()); const stoday=isToday(t.start);
      h+='<div class="plive"><div class="l1"><span class="hdot"></span>'+
         '<span class="pw"><b>'+esc(t.who||'—')+'</b> — '+esc(t.office||'—')+'</span>'+
         '<span class="pstat">Clocked in</span></div>'+
         '<div class="ptime">'+(stoday?('since '+esc(fmtClock(t.start))):('since '+esc(fmtDayT(t.start))+' '+esc(fmtClock(t.start))))+
         ' · '+durLabel(mins)+'</div></div>'; });
  }
  if(outToday.length){
    h+='<div class="secthead">Clocked in / out today</div><div class="panel">';
    outToday.forEach(t=>{ const m=durMin(t.start,t.end);
      h+='<div class="kv"><span><b>'+esc(t.who||'—')+'</b> — '+esc(t.office||'—')+'</span><b>'+esc(fmtClock(t.start))+' – '+esc(fmtClock(t.end))+' <i>'+durLabel(m)+'</i></b></div>'; });
    h+='</div>';
  }
  return h;
}
function viewRecent(){
  const ev=[];
  issues.forEach(i=>{ if(i.fixed) ev.push({date:i.fixed,kind:'Fixed',i}); if(i.date) ev.push({date:i.date,kind:'Reported',i}); });
  log.forEach(w=>{ if(w.date&&(w.note||w.partNumber)){ const i=issues.find(x=>x.id===w.issueId); ev.push({date:w.date,kind:'Work',w,i}); } });
  ev.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const buckets={today:[],week:[],month:[]};
  ev.forEach(e=>{ const n=daysAgo(e.date); if(n==null) return; if(n===0)buckets.today.push(e); else if(n<=6)buckets.week.push(e); else if(n<=31)buckets.month.push(e); });
  let h=speedWindow();
  const catOf=e=> e.kind==='Fixed'?'fixed' : (e.kind==='Reported'?'new':'work');
  const CATS=[['fixed','Fixed'],['new','New report'],['work','Work logged']];
  const bucketSec=(bkey,btitle,list)=>{
    const groups={fixed:[],new:[],work:[]};
    list.forEach(e=>groups[catOf(e)].push(e));
    let inner='';
    CATS.forEach(([cat,label])=>{ const g=groups[cat]; let sub='';
      if(g.length) g.slice(0,80).forEach(e=>sub+=actRow(e)); else sub='<div class="none">Nothing here.</div>';
      inner+=nestSec(bkey+'_'+cat,label,'<span class="sct">'+g.length+'</span>',sub); });
    return nestSec(bkey,btitle,'<span class="sct">'+list.length+'</span>',inner);
  };
  h+=bucketSec('__act_today','Today',buckets.today);
  const clock=presenceToday();
  if(clock){ const hereNow=timelog.filter(t=>t.start&&!t.end).length;
    const chip=hereNow>0?('<span class="sct" style="color:#158043;font-weight:800">'+hereNow+' in</span>'):'';
    h+=nestSec('__clock','Clock in / out',chip,clock); }
  return h;
}
function dayLabel(s){ const n=daysAgo(s); if(n===0)return'Today'; if(n===1)return'Yesterday'; const d=dObj(s); return d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):s; }
function actRow(e){ const i=e.i,id=i?i.id:''; let b='',s='';
  if(e.kind==='Fixed'){ b='Fixed · '+(i?esc(i.chair||'')+' '+esc(i.office):''); s=i?esc(i.problem):''; }
  else if(e.kind==='Reported'){ b='New report · '+(i?esc(i.chair||'')+' '+esc(i.office):''); s=i?esc(i.problem):''; }
  else { b='Work logged'+(e.w.who?' · '+esc(e.w.who):'')+(i?' · '+esc(i.office):''); s=esc(cleanNote(e.w.note)||('Used part '+e.w.partNumber)); }

function partsUsage(){ const u={}; const now=today0();
  log.forEach(l=>{ const n=(l.partNumber||'').trim(); const q=parseFloat(l.qty)||0; if(!n||q<=0) return;
    const o=u[n]||(u[n]={month:0,year:0,all:0,last:''}); o.all+=q;
    if(l.date){ if(!o.last||l.date>o.last) o.last=l.date;
      const d=dObj(l.date); if(d){ const days=Math.round((now-d)/MS); if(days<=30)o.month+=q; if(days<=365)o.year+=q; } } });
  return u; }
// latest sign of life for a part: most recent of last-used, last-ordered, order-date
function lastActivity(p,usage){ const c=[]; const u=usage[p.number];
  if(u&&u.last) c.push(String(u.last).slice(0,10));
  if(p.lastOrdered) c.push(String(p.lastOrdered).slice(0,10));
  if(p.orderDate) c.push(String(p.orderDate).slice(0,10));
  c.sort(); return c.length?c[c.length-1]:''; }
function idleLabel(s){ if(!s) return 'never used or ordered';
  const days=daysAgo(s); if(days==null) return '';
  if(days<=30) return 'active this month';
  const mo=Math.round(days/30); if(mo<12) return 'idle '+mo+' months';
  const yr=days/365; return 'idle '+(yr<10?yr.toFixed(1):Math.round(yr))+(yr<2?' year':' years'); }

function partsDashboard(){
  const toOrder=parts.filter(p=>p.orderNow && !(p.onOrder>0));
  const onOrder=parts.filter(p=>p.onOrder>0);
  let val=0, haveCost=0;
  parts.forEach(p=>{ const c=parseFloat(p.cost), s=parseFloat(p.inStock);
    if(!isNaN(c)&&c>0){ haveCost++; if(!isNaN(s)) val+=c*s; } });
  const valStr = haveCost? ('$'+Math.round(val).toLocaleString()) : '—';
  const usage=partsUsage();
  const anyUsage=Object.keys(usage).length>0;
  const haveDated=Object.keys(usage).some(k=>usage[k].year>0||usage[k].month>0);
  const rows=parts.map(p=>({p,u:usage[p.number]||{month:0,year:0,all:0,last:''}}));
  let movers = haveDated
    ? rows.filter(x=>x.u.year>0).sort((a,b)=>b.u.year-a.u.year||b.u.month-a.u.month).slice(0,6)
    : rows.filter(x=>x.u.all>0).sort((a,b)=>b.u.all-a.u.all).slice(0,6);
  // sitting unused = on the shelf, but no use in the last 12 months; oldest / never first
  const dead = rows.filter(x=>parseFloat(x.p.inStock)>0 && !(x.u.year>0))
    .map(x=>({p:x.p,last:lastActivity(x.p,usage)}))
    .sort((a,b)=>{ if(!a.last&&!b.last) return 0; if(!a.last) return -1; if(!b.last) return 1; return a.last.localeCompare(b.last); });
  let h='<div class="stats">'+
    '<div class="stat"><b>'+toOrder.length+'</b><span>To order</span></div>'+
    '<div class="stat"><b style="font-size:1.15rem">'+valStr+'</b><span>On the shelf</span></div>'+
    '<div class="stat"><b>'+onOrder.length+'</b><span>On order</span></div></div>';
  h+='<button class="addpart-wide" id="wh-createpo">🧾 Create a purchase order</button>';
  if(haveCost<parts.length){ h+='<div class="pnote">Add a <b>Unit cost</b> to parts in Airtable to see shelf value — '+haveCost+' of '+parts.length+' have one so far.</div>'; }
  h+='<div class="secthead">Fast movers'+(haveDated?' · last 12 months':' · most used')+'</div><div class="panel">';
  if(movers.length){ const mx=haveDated?(movers[0].u.year||1):(movers[0].u.all||1);
    movers.forEach(m=>{ const metric=haveDated?m.u.year:m.u.all; const pct=Math.max(Math.round(metric/mx*100),8);
      const label=haveDated ? ('<b>'+m.u.year+'</b> this year'+(m.u.month?' · <b>'+m.u.month+'</b> this month':'')) : ('<b>'+m.u.all+'</b> used');
      h+='<div class="orow"><div class="obar-wrap"><div class="obar-top"><span class="oname">'+esc(m.p.name)+'</span><span class="ocount">'+label+'</span></div><div class="obar"><i style="width:'+pct+'%"></i></div></div></div>'; }); }
  else h+='<div class="none">Builds as the crew logs parts used in the app.</div>';
  h+='</div>';
  // Sitting unused — collapsible, with an idle scale per part
  let inner='';
  if(!anyUsage) inner='<div class="none">Once parts get used in the app, the ones that never move show here.</div>';
  else if(!dead.length) inner='<div class="none">Nothing flagged — every stocked part has moved in the last year.</div>';
  else dead.slice(0,20).forEach(d=>{ const lab=idleLabel(d.last); const old=(!d.last)|| (daysAgo(d.last)!=null && daysAgo(d.last)>365);
    inner+='<div class="prow2"><div class="pl"><div class="pn">'+esc(d.p.name)+'</div>'+
      '<div class="pm">#'+esc(d.p.number)+' · '+esc(d.p.inStock)+' on hand'+(d.last?' · last activity '+fmt(d.last):'')+'</div></div>'+
      '<span class="idle'+(old?' bad':'')+'">'+esc(lab)+'</span></div>'; });
  const moreNote = dead.length>20 ? '<div class="pnote">Showing the 20 longest-idle. '+(dead.length-20)+' more.</div>' : '';
  h+=nestSec('__sitting','Sitting unused','<span class="sct">'+(anyUsage?dead.length:0)+'</span>', inner+moreNote);
  return h;
}

function assetYear(a){ const m=String(a.date||'').match(/(19|20)\d\d/); return m?parseInt(m[0],10):null; }
function assetAge(a){ const y=assetYear(a); if(!y) return null; const d=new Date().getFullYear()-y; return (d>=0&&d<80)?d:null; }

// Adrian-editable expected service life. Defaults below; the "Equipment Life" Airtable table overrides any of these.
const LIFE_DEFAULT={'Chair & unit':15,'Operatory light':12,'X-ray':15,'Pano / 3D':12,'Sterilizer / autoclave':10,'Vacuum pump':12,'Compressor':12,'Intraoral camera / sensor':7,'Scanner (iTero)':6,'Model trimmer':15,'Amalgam separator':10};
function normCat(t){ const s=String(t||'').toLowerCase();
  if(/scanner|itero/.test(s)) return 'Scanner (iTero)';
  if(/intraoral|sensor|camera/.test(s)) return 'Intraoral camera / sensor';
  if(/pano|ceph|cbct|3d/.test(s)) return 'Pano / 3D';
  if(/x.?ray/.test(s)) return 'X-ray';
  if(/autoclave|steriliz|statim|m-?11/.test(s)) return 'Sterilizer / autoclave';
  if(/vac/.test(s)) return 'Vacuum pump';
  if(/comp/.test(s)) return 'Compressor';
  if(/trimmer/.test(s)) return 'Model trimmer';
  if(/amalgam/.test(s)) return 'Amalgam separator';
  if(/light/.test(s)) return 'Operatory light';
  if(/chair|unit/.test(s)) return 'Chair & unit';
  return (String(t||'').trim())||'Other';
}
function repairsFor(a){ const nl=normChair(a.location); if(!nl) return 0; return issues.filter(i=>i.office===a.office && normChair(i.chair)===nl).length; }
function replaceFlag(a){ const age=assetAge(a); if(age==null) return {state:'',age:null,life:null,left:null,cat:normCat(a.asset),reps:0,custom:false};
  const cat=normCat(a.asset), reps=repairsFor(a);
  const ov=parseFloat(a.lifeOverride); const custom=(!isNaN(ov)&&ov>0);
  const life=custom?ov:lifeMap[cat];
  if(life==null) return {state:'',age:age,life:null,left:null,cat:cat,reps:reps,custom:false};
  const left=life-age; var state='';
  if(left<=0) state='replace';            // hit or past expected life
  else if(left<=3) state='watch';         // 1–3 years left
  return {state:state,age:age,life:life,left:left,cat:cat,reps:reps,custom:custom}; }
function cdownChip(f){ if(f.left==null) return '';
  if(f.left>0) return '<span class="cdown green">'+f.left+' yr'+(f.left>1?'s':'')+' left</span>';
  if(f.left===0) return '<span class="cdown red">due now</span>';
  return '<span class="cdown red">'+(-f.left)+' yr'+((-f.left)>1?'s':'')+' over</span>'; }
function isOOS(a){ return String(a.status||'').toLowerCase()==='out of service'; }

function verdictFor(avgAge){ if(avgAge==null) return ['—','v-mid'];
  if(avgAge<6) return ['Young fleet','v-young'];
  if(avgAge<9) return ['Middle-aged','v-mid'];
  if(avgAge<12) return ['Maturing','v-mat'];

function spectrumHtml(b,total){ const segs=[['0-5','#1B9E4B'],['5-10','#7BB026'],['10-15','#E8930C'],['15+','#E5484D'],['unknown','#cdd5dc']];
  let s=''; if(!total) return s; segs.forEach(x=>{ if(!b[x[0]]) return; const pct=(b[x[0]]/total*100).toFixed(1); s+='<span style="width:'+pct+'%;background:'+x[1]+'" title="'+x[0]+': '+b[x[0]]+'"></span>'; }); return s; }
function legendHtml(b){ return '<div class="speclegend"><span><i style="background:#1B9E4B"></i>0–5</span><span><i style="background:#7BB026"></i>5–10</span><span><i style="background:#E8930C"></i>10–15</span><span><i style="background:#E5484D"></i>15+</span>'+(b.unknown?'<span><i style="background:#cdd5dc"></i>no date</span>':'')+'</div>'; }
function fleetMetrics(list){ let ageSum=0, ageN=0, rep=0, wat=0;
  const act=list.filter(a=>!isOOS(a));

    const f=replaceFlag(a); if(f.state==='replace')rep++; else if(f.state==='watch')wat++; });
  return {b, ageN, avgAge:(ageN?ageSum/ageN:null), rep, wat, total:act.length}; }

function assetsToCSV(list){

function downloadCSV(name,text){

function assetsDashboard(){
  if(!assets.length) return '<div class="empty">No equipment loaded yet.</div>';
  const active=assets.filter(a=>!isOOS(a)), oos=assets.filter(isOOS);
  const cats={}; let oldest=null, oldestAge=-1;
  let ageSum=0, ageN=0; const offAge={};
  const b={'0-5':0,'5-10':0,'10-15':0,'15+':0,'unknown':0};
  active.forEach(a=>{ const c=normCat(a.asset); cats[c]=(cats[c]||0)+1;
    const age=assetAge(a);
    if(age==null) b.unknown++;
    else { if(age<5)b['0-5']++; else if(age<10)b['5-10']++; else if(age<15)b['10-15']++; else b['15+']++;
      ageSum+=age; ageN++; const o=a.office||'(no office)'; (offAge[o]=offAge[o]||{s:0,n:0}); offAge[o].s+=age; offAge[o].n++;
      if(age>oldestAge){oldestAge=age; oldest=a;} }
  });
  // replace-soon flags grouped by category (active equipment only)
  const flagged=active.map(a=>({a,f:replaceFlag(a)})).filter(x=>x.f.state);
  const repCount=flagged.filter(x=>x.f.state==='replace').length;
  const watCount=flagged.filter(x=>x.f.state==='watch').length;
  const byCat={};
  flagged.forEach(x=>{ const c=x.f.cat; (byCat[c]=byCat[c]||{replace:[],watch:[]}); byCat[c][x.f.state].push(x); });
  const byLeft=(p,q)=>(p.f.left-q.f.left)||(q.f.reps-p.f.reps);   // most over first, then most repairs
  const catKeys=Object.keys(byCat).sort((x,y)=>(byCat[y].replace.length-byCat[x].replace.length)||(byCat[y].watch.length-byCat[x].watch.length)||x.localeCompare(y));
  // ---- Fleet health hero (overall age + condition at a glance) ----

  Object.keys(offAge).forEach(o=>{ const d=offAge[o]; if(d.n>=5){ const av=d.s/d.n; if(av>oldOffAvg){oldOffAvg=av; oldOff=o;} } });
  let hero='<div class="fhcard">'+

    '<div class="fhmain"><span class="fhbig">'+(avgAge!=null?avgAge.toFixed(1):'—')+'<i> yrs avg</i></span>'+
      '<span class="fhmini"><b>'+attPct+'%</b> past or nearing end of life</span></div>'+
    '<div class="spectrum">'+spectrumHtml(b,active.length||1)+'</div>'+legendHtml(b)+

    '</div>';
  let h=hero+'<div class="stats stats-eq">'+
    '<div class="stat tap" data-drill="all"><b>'+assets.length+'</b><span>Total items ›</span></div>'+
    '<div class="stat tap'+(repCount?' dupe':'')+'" data-drill="replace"><b>'+repCount+'</b><span>Replace now ›</span></div>'+
    '<div class="stat tap" data-drill="watch"><b>'+watCount+'</b><span>Coming due ›</span></div>'+
    '<div class="stat tap" data-drill="oos"><b>'+oos.length+'</b><span>Out of service ›</span></div></div>';
  // ---- Replace soon: parent window → category windows → items ----
  let catHtml='';
  if(!catKeys.length){ catHtml='<div class="none">Nothing past its expected life yet. Targets live in the Equipment Life table in Airtable — change them there and this updates.</div>'; }
  else catKeys.forEach(c=>{ const g=byCat[c]; const key='repl:'+c; const isOpen=!!openSecs[key];
      const rows=g.replace.slice().sort(byLeft).concat(g.watch.slice().sort(byLeft));

  let probInner='';

  else probInner='<div class="none">Not enough repair history yet to flag repeat offenders.</div>';

  Object.keys(cats).map(t=>[t,cats[t]]).sort((a,b)=>b[1]-a[1]).forEach(p=>{ typeInner+='<div class="kv"><span>'+esc(p[0])+'</span><b>'+p[1]+' <i>items</i></b></div>'; });
  let healthHtml='';
  healthHtml+=eqpSec('eqp:age','Age profile','',ageInner);
  healthHtml+=eqpSec('eqp:prob','Repeat repairs · same spot, more than once',(top.length?String(top.length):''),probInner);
  healthHtml+=eqpSec('eqp:type','By type',Object.keys(cats).length+' kinds',typeInner);
  h+=nestSec('__equiphealth','Equipment health','',healthHtml);
  return h;
}

        h+='<div class="arow tapr" data-aid="'+esc(a.id)+'"><div class="al"><div class="an">'+esc(a.office)+(a.location?' · '+esc(a.location):'')+'</div>'+(meta?'<div class="am">'+meta+'</div>':'')+'</div>'+(isOOS(a)?'<span class="fbadge oos">Out</span>':(fl.state?cdownChip(fl):''))+(age!=null?'<div class="aage'+(age>=15?' old':'')+'">'+age+'y</div>':'')+'<span class="rchev">›</span></div>'; });
      h+='</div></div>';
    });
    return h;
  }
  if(assetDrill==='oos'){
    const list=assets.filter(isOOS).slice().sort((p,q)=>(p.office||'').localeCompare(q.office||'')||(p.location||'').localeCompare(q.location||''));
    h+='<div class="secthead">Out of service · '+list.length+' item'+(list.length===1?'':'s')+'</div>';
    h+='<div class="hint">These are off the floor and left out of the health numbers. Tap one to return it to service or edit it.</div><div class="panel">';
    if(!list.length) h+='<div class="none">Nothing is out of service right now.</div>';
    else list.forEach(a=>{ const age=assetAge(a);
      h+='<div class="arow tapr" data-aid="'+esc(a.id)+'"><div class="al"><div class="an">'+esc(normCat(a.asset))+' · '+esc(a.office)+(a.location?' · '+esc(a.location):'')+'</div>'+
        '<div class="am">'+[a.model,a.serial?'SN '+a.serial:'',a.number?'#'+a.number:''].filter(Boolean).map(esc).join(' · ')+'</div></div>'+
        '<span class="fbadge oos">Out</span>'+(age!=null?'<div class="aage">'+age+'y</div>':'')+'<span class="rchev">›</span></div>'; });
    h+='</div>';
    return h;
  }
  const flagged=assets.filter(a=>!isOOS(a)).map(a=>({a,f:replaceFlag(a)})).filter(x=>x.f.state===assetDrill);
  flagged.sort((p,q)=>(p.f.left-q.f.left)||(q.f.reps-p.f.reps));
  const title=(assetDrill==='replace'?'Replace now':'Coming due')+' · '+flagged.length+' item'+(flagged.length===1?'':'s');
  h+='<div class="secthead">'+title+'</div><div class="panel">';
  if(!flagged.length) h+='<div class="none">Nothing here right now.</div>';
  else flagged.forEach(x=>{ const f=x.f,a=x.a;
    h+='<div class="arow tapr" data-aid="'+esc(a.id)+'"><div class="al"><div class="an">'+esc(a.office)+(a.location?' · '+esc(a.location):'')+'</div><div class="am">'+esc(f.cat)+' · '+f.age+' yrs old · lasts ~'+f.life+(f.custom?' (custom)':'')+(f.reps?' · '+f.reps+' repair'+(f.reps>1?'s':''):'')+'</div></div>'+cdownChip(f)+'<span class="rchev">›</span></div>'; });
  h+='</div>';
  return h;
}

    h+='<div class="vhdr" style="color:var(--med)">On the way<span class="vn">'+onWay.length+'</span></div>';

        '<div class="pl"><div class="pn">'+esc(p.name)+'</div>'+
        '<div class="pm">#'+esc(p.number)+' · on hand '+esc(p.inStock)+(p.orderDate?' · ordered '+fmt(p.orderDate):'')+'</div></div>'+
        '<div class="po ontag">'+esc(p.onOrder)+' ordered</div></div>';
    });
  }
  if(!list.length){ return h + (onWay&&onWay.length ? '<div class="empty" style="padding:16px">Nothing else to order. 👍</div>' : '<div class="empty">Nothing to order today — every part is above its level. 👍</div>'); }

    h+='<div class="vhdr">'+esc(v)+'<span class="vn">'+items.length+'</span></div>';

        '<div class="pm">#'+esc(p.number)+' · on hand '+esc(p.inStock)+' · floor '+esc(p.reorderAt)+(p.bin?' · bin '+esc(p.bin):'')+'</div></div>'+

     '<div class="twocol"><div><input id="pt-min" type="number" min="0" placeholder="min" value="'+(p.reorderAt===''||p.reorderAt==null?'':esc(p.reorderAt))+'"><div class="lvllbl">min · reorder at</div></div>'+

  const ed=document.getElementById('pt-edit'); if(ed) ed.onclick=()=>openEditPart(p.number);

  show();

async function doSaveLevels(number){
  const minV=document.getElementById('pt-min').value, maxV=document.getElementById('pt-max').value;
  if(minV===''&&maxV===''){ toast('Enter a min and/or max'); return; }
  if(minV!==''&&maxV!==''&&Number(maxV)<Number(minV)){ toast('Max should be at least the min'); return; }
  const btn=document.getElementById('pt-lvl'); btn.disabled=true; btn.textContent='Saving…';
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'editpart',number:number,reorderAt:minV,max:maxV})});
    const d=await r.json(); if(d.error||d.ok===false) throw new Error(d.error||'Could not save');
    const p=partByNumber(number); if(p){ if(minV!=='') p.reorderAt=Math.round(Number(minV)); if(maxV!=='') p.max=Math.round(Number(maxV));
      p.orderNow=(typeof p.inStock==='number'&&typeof p.reorderAt==='number'&&p.inStock<=p.reorderAt); }
    toast('Min / max saved'); openPart(number); render();
  }catch(e){ btn.disabled=false; btn.textContent='Save min / max'; toast('Could not save'); }
}
async function doOrder(number){
  const q=Number(document.getElementById('pt-oqty').value); if(!(q>0)){ document.getElementById('pt-oqty').focus(); return; }
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'order',number:number,qty:q})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    const p=partByNumber(number); if(p){ p.onOrder=q; p.orderDate=new Date().toISOString().slice(0,10); }
    toast('Marked ordered'); openPart(number); render();
  }catch(e){ toast('Could not save'); }
}
async function doReceive(number){
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'receive',number:number})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    const p=partByNumber(number); if(p){ p.inStock=(typeof p.inStock==='number'?p.inStock:0)+(p.onOrder||0); p.onOrder=0;
      p.orderNow=(typeof p.inStock==='number'&&typeof p.reorderAt==='number'&&p.inStock<=p.reorderAt); }
    toast('Received into stock'); openPart(number); render();
  }catch(e){ toast('Could not save'); }
}
async function doAdjust(number){
  const v=Number(document.getElementById('pt-adj').value); if(isNaN(v)||v<0){ document.getElementById('pt-adj').focus(); return; }
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'adjust',number:number,inStock:v})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    const p=partByNumber(number); if(p){ p.inStock=Math.round(v); p.orderNow=(typeof p.reorderAt==='number'&&p.inStock<=p.reorderAt); }
    toast('Count updated'); openPart(number); render();
  }catch(e){ toast('Could not save'); }
}

async function doSavePart(number){
  const p=partByNumber(number); const err=document.getElementById('ep-err');
  const name=(document.getElementById('ep-name').value||'').trim();
  const num=(document.getElementById('ep-number').value||'').trim();
  if(!name){ err.textContent='Part name can\u2019t be blank.'; return; }
  if(!num){ err.textContent='Part number can\u2019t be blank.'; return; }
  const minV=document.getElementById('ep-min').value, maxV=document.getElementById('ep-max').value;
  if(minV!==''&&maxV!==''&&Number(maxV)<Number(minV)){ err.textContent='Max should be at least the min.'; return; }
  const btn=document.getElementById('ep-save'); btn.disabled=true; btn.textContent='Saving…';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({
      action:'editpart', id:(p?p.id:''), number:num, name:name,
      vendor:(document.getElementById('ep-vendor').value||'').trim(),
      bin:(document.getElementById('ep-bin').value||'').trim(),
      inStock:document.getElementById('ep-stock').value,
      cost:document.getElementById('ep-cost').value,
      reorderAt:minV, max:maxV,
      netsuiteItem:(document.getElementById('ep-ns').value||'').trim() })});

  }catch(e){ btn.disabled=false; btn.textContent='Save changes'; err.textContent=String(e.message||'Could not save'); }
}

async function doAddPart(){
  const num=document.getElementById('np-num').value.trim();
  const name=document.getElementById('np-name').value.trim();
  const err=document.getElementById('np-err');
  if(!num || !name){ err.textContent='Part number and name are required.'; return; }
  if(partByNumber(num)){ err.textContent='A part with number '+num+' already exists.'; return; }
  const payload={action:'addpart', number:num, name:name,
    bin:document.getElementById('np-bin').value.trim(),
    vendor:document.getElementById('np-vendor').value.trim(),
    inStock:document.getElementById('np-stock').value,
    reorderAt:document.getElementById('np-min').value,
    max:document.getElementById('np-max').value };
  const btn=document.getElementById('np-save'); btn.disabled=true; btn.textContent='Adding…';
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    const d=await r.json(); if(d.error||d.ok===false) throw new Error(d.error||'Could not add');
    const inS=Math.max(Math.round(Number(payload.inStock)||0),0), ra=Math.max(Math.round(Number(payload.reorderAt)||0),0);
    const mx=(payload.max!==''&&!isNaN(Number(payload.max)))?Math.max(Math.round(Number(payload.max)),0):'';
    parts.push({id:d.id||('tmp'+Date.now()),name:name,number:num,inStock:inS,reorderAt:ra,max:mx,
      bin:payload.bin,vendor:payload.vendor,onOrder:0,orderDate:'',orderNow:(inS<=ra)});
    toast('Part added'); hide(); render();
  }catch(e){ btn.disabled=false; btn.textContent='Add part'; err.textContent=String(e.message||'Could not add'); }
}

async function doAddEquip(){
  const err=document.getElementById('eq-err');
  const so=document.getElementById('eq-office');
  let office=so.value;
  if(office==='__new'){ office=(document.getElementById('eq-newoffice').value||'').trim(); }
  if(!office){ err.textContent='Choose or name an office.'; return; }
  const loc=(document.getElementById('eq-loc').value||'').trim();
  if(!loc){ err.textContent='Enter a room / location.'; return; }
  const batchMode = document.getElementById('eq-batch-wrap').style.display!=='none';
  let rows=[];
  if(batchMode){
    const lines=(document.getElementById('eq-batch').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if(!lines.length){ err.textContent='Paste at least one line.'; return; }
    rows=lines.map(line=>{ const c=line.split(/\t|,/).map(s=>s.trim());
      return {office:office,location:loc,number:c[0]||'',asset:c[1]||'',serial:c[2]||'',model:c[3]||'',date:c[4]||''}; })
      .filter(r=>r.asset||r.number||r.serial);
    if(!rows.length){ err.textContent='Could not read any rows. Check the order: Asset#, Type, Serial, Make/Model, Date.'; return; }
  } else {
    const type=(document.getElementById('eq-type').value||'').trim();
    if(!type){ err.textContent='Enter the equipment type (e.g. Chair).'; return; }
    rows=[{office:office,location:loc,number:(document.getElementById('eq-num').value||'').trim(),asset:type,
      serial:(document.getElementById('eq-serial').value||'').trim(),model:(document.getElementById('eq-model').value||'').trim(),
      date:(document.getElementById('eq-date').value||'').trim()}];
  }
  const btn=document.getElementById('eq-save'); btn.disabled=true; btn.textContent='Adding…';
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'addasset',assets:rows})});
    const d=await r.json(); if(d.error||d.ok===false) throw new Error(d.error||'Could not add');
    rows.forEach(rw=>{ assets.push({id:'tmp'+Math.random(),number:rw.number,location:rw.location,asset:rw.asset,serial:rw.serial,model:rw.model,date:rw.date,maker:'',office:rw.office}); });
    if(!officeNames.some(o=>o.toLowerCase()===office.toLowerCase())){ officeNames.push(office); officeNames.sort(); }
    toast((d.created||rows.length)+' item'+((d.created||rows.length)===1?'':'s')+' added'); hide(); render();
  }catch(e){ btn.disabled=false; btn.textContent='Add equipment'; err.textContent=String(e.message||'Could not add'); }
}

async function doSaveAsset(id){
  const err=document.getElementById('ea-err');
  let office=document.getElementById('ea-office').value;
  if(office==='__new'){ office=(document.getElementById('ea-newoffice').value||'').trim(); }
  const payload={ action:'editasset', id:id, office:office,
    location:(document.getElementById('ea-loc').value||'').trim(),
    asset:(document.getElementById('ea-type').value||'').trim(),
    model:(document.getElementById('ea-model').value||'').trim(),
    serial:(document.getElementById('ea-serial').value||'').trim(),
    number:(document.getElementById('ea-num').value||'').trim(),
    date:(document.getElementById('ea-date').value||'').trim() };
  const lifeRaw=(document.getElementById('ea-life').value||'').trim();
  payload.lifeOverride = lifeRaw==='' ? null : (parseFloat(lifeRaw)||null);
  if(!payload.asset){ err.textContent='Type can\u2019t be empty.'; return; }
  const btn=document.getElementById('ea-save'); btn.disabled=true; btn.textContent='Saving…';
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    const d=await r.json(); if(d.error||d.ok===false) throw new Error(d.error||'Could not save');
    const a=assets.find(x=>x.id===id);
    if(a){ a.office=office; a.location=payload.location; a.asset=payload.asset; a.model=payload.model; a.serial=payload.serial; a.number=payload.number; a.date=payload.date; a.lifeOverride=(payload.lifeOverride==null?'':payload.lifeOverride); }
    if(office && !officeNames.some(o=>o.toLowerCase()===office.toLowerCase())){ officeNames.push(office); officeNames.sort(); }
    toast('Saved'); hide(); render();
  }catch(e){ btn.disabled=false; btn.textContent='Save changes'; err.textContent=String(e.message||'Could not save'); }
}

async function doSetAssetStatus(id,status){

}
function viewOffices(){

    });
    h+='</div></div>';

  h+='<div class="ohead"><span class="nm">'+esc(selOffice)+'</span><span class="muted">'+ongoing.length+' ongoing</span></div>';
  if(oCount){ h+='<div class="dupbtn" data-officedupes="1">⚠︎ '+oCount+' possible duplicates here — '+(showOfficeDupes?'hide':'review')+'</div>'; }
  if(showOfficeDupes && oCount){ h+=dupeSection(oClusters, 'at '+selOffice); }
  if(!ongoing.length){ h+='<div class="empty">Nothing open at '+esc(selOffice)+'. 🎉</div>'; return h; }
  h+=boardModeToggle();
  h+=stackBoard(ongoing);
  return h;
}

async function doClockIn(){
  const who=(document.getElementById('ci-who')||{}).value||''; const office=(document.getElementById('ci-office')||{}).value||'';
  const err=document.getElementById('ci-err');
  if(!who){ err.textContent='Pick who\u2019s working.'; return; }
  if(!office){ err.textContent='Pick an office.'; return; }
  lastWorker=who; const when=new Date().toISOString();
  const btn=document.getElementById('ci-go'); btn.disabled=true; btn.textContent='Clocking in…';
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'startwork',office:office,who:who,when:when})});
    const d=await r.json(); if(d.error||d.ok===false) throw new Error(d.error||'Could not clock in');
    // Server closes any office they forgot to clock out of, stamped at this same time.
    let prior='';
    (d.closed||[]).forEach(c=>{ const t=timelog.find(x=>x.id===c.id); if(t) t.end=c.end; if(c.office) prior=c.office; });
    timelog.push({id:d.id,problemId:'',office:office,chair:'',who:who,start:when,end:''});
    let msg=who+' clocked in at '+office;
    if((d.closed||[]).length) msg+=' · clocked out of '+(prior||'the last office')+' just now';
    toast(msg); hide(); render();
  }catch(e){ btn.disabled=false; btn.textContent='▶ Clock in'; err.textContent='Add the Time Log table in Airtable to use the clock.'; }
}

async function doClockOut(id){
  const v=timelog.find(t=>t.id===id); const when=new Date().toISOString();
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'endwork',id:id,when:when})});
    const d=await r.json(); if(d.error||d.ok===false) throw new Error(d.error||'Could not clock out');
    if(v) v.end=when; toast('Clocked out'+(v&&v.who?' · '+v.who:'')); hide(); render();
  }catch(e){ toast('Could not clock out'); }
}
function openDetail(id){
  const i=issues.find(x=>x.id===id); if(!i)return;
  const notes=log.filter(n=>n.issueId===id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const n=daysAgo(i.date);
  const twins=issues.filter(x=>x.id!==id && isOpen(x) && x.office===i.office && normChair(x.chair)===normChair(i.chair) && normChair(i.chair));
  $('#sheet').innerHTML='<div class="grab"></div>'+
    '<h2 style="margin:0 0 4px">'+esc(i.chair||'—')+' <span style="color:var(--muted);font-size:.9rem;font-weight:700">'+esc(i.office)+'</span></h2>'+
    '<div class="muted" style="margin-bottom:8px">'+esc(i.problem)+'</div>'+
    (i.impact?'<span class="pill '+i.impact+'">'+i.impact+'</span> ':'')+
    '<span class="age">reported '+fmt(i.date)+(n>0?' · '+n+'d ago':'')+(i.reporter?' · by '+esc(i.reporter):'')+'</span>'+
    (twins.length?'<div class="dupbtn" style="margin-top:10px" id="d-twin">⚠︎ '+twins.length+' other open report'+(twins.length>1?'s':'')+' for this spot — view</div>':'')+
    (READONLY
      ? '<label>Urgency</label><div class="muted" style="margin-bottom:8px">'+esc(i.impact||'—')+'</div><label>Status</label><div class="muted">'+esc(i.status||'—')+'</div>'
      : '<label>Urgency</label><div class="urgencygrid" id="d-urgency">'+[['high','High'],['medium','Medium'],['low','Low']].map(p=>'<button class="'+p[0]+(p[0]===i.impact?' sel':'')+'" data-u="'+p[0]+'">'+p[1]+'</button>').join('')+'</div>'+
        '<label>Status</label><div class="statusgrid" id="d-status">'+STATUSES.map(s=>'<button class="'+(s===i.status?'sel':'')+'" data-s="'+s+'">'+s+'</button>').join('')+'</div>')+
    (i.history?'<label>History (from the logs)</label><div class="hist">'+esc(i.history)+'</div>':'')+
    '<label>Work log</label><div>'+(notes.length?notes.map(nt=>'<div class="note"><div class="d">'+fmt(nt.date)+(nt.who?' · '+esc(nt.who):'')+(nt.partNumber?' · part '+esc(nt.partNumber)+(nt.qty?' ×'+nt.qty:''):'')+'</div>'+esc(cleanNote(nt.note))+notePhotos(nt)+'</div>').join(''):'<div class="note" style="color:var(--muted)">No work logged here yet</div>')+'</div>'+
    (READONLY ? '' :
    '<label>Log work done</label>'+
    '<div style="font-size:.8rem;color:var(--muted);margin-top:2px">Workers (check everyone who worked on it)</div>'+crewChecks('d-who', lastWorker)+
    '<textarea id="d-note" placeholder="What did you do?" style="margin-top:8px"></textarea>'+
    '<label>Parts used</label><div id="d-parts"></div>'+
    '<button type="button" class="addpart-btn" id="d-addpart">+ add another part</button>'+
    '<datalist id="partlist">'+parts.map(p=>'<option value="'+esc(p.number)+'">'+esc(p.number)+' — '+esc(p.name)+(p.bin?' ('+esc(p.bin)+')':'')+'</option>').join('')+'</datalist>'+
    '<label>Photos</label><div id="d-photo"></div>'+
    '<input id="d-photofile" type="file" accept="image/*" multiple style="display:none">'+
    '<button class="primary-btn" id="d-add">Add to work log</button>'+
    (twins.length?'<button class="warn-btn" id="d-dup">Mark this one a duplicate (close it)</button>':''))+
    '<button class="ghost-btn" id="d-close">Done</button>'+
    (READONLY ? '' : '<button class="ghost-btn" id="d-delete" style="color:#b0384a;margin-top:2px">🗑 Delete this request</button>');
  const dstat=$('#d-status'); if(dstat) dstat.querySelectorAll('button').forEach(b=>b.onclick=()=>setStatus(id,b.dataset.s));
  const durg=$('#d-urgency'); if(durg) durg.querySelectorAll('button').forEach(b=>b.onclick=()=>setUrgency(id,b.dataset.u));
  const dadd=document.getElementById('d-add'); if(dadd) dadd.onclick=()=>addNote(id);
  const dparts=document.getElementById('d-parts'); if(dparts){ dparts.innerHTML=''; addPartRow(); }
  const dap=document.getElementById('d-addpart'); if(dap) dap.onclick=()=>addPartRow();
  if(!READONLY){ pendingPhotos=[]; renderPhotoPreview();
    const pf=document.getElementById('d-photofile'); if(pf) pf.onchange=async(e)=>{
      const files=Array.from(e.target.files||[]); if(!files.length) return;
      let bad=0;
      for(const f of files){
        if(pendingPhotos.length>=MAXPHOTOS){ toast('Up to '+MAXPHOTOS+' photos per entry'); break; }
        try{ pendingPhotos.push(await compressImage(f,1280,0.7)); }catch(err){ bad++; }
      }
      if(bad) toast(bad===1?'Could not read one photo':'Could not read '+bad+' photos');
      renderPhotoPreview(); e.target.value=''; }; }
  $('#d-close').onclick=hide;
  const ddel=document.getElementById('d-delete'); if(ddel) ddel.onclick=()=>openDeleteRequest(id);
  if(twins.length){ const dt=$('#d-twin'); if(dt) dt.onclick=()=>openDetail(twins[0].id); const dd=$('#d-dup'); if(dd) dd.onclick=()=>markDuplicate(id, twins[0]); }
  show();
}

async function setStatus(id,status){
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'status',id:id,status:status})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    const i=issues.find(x=>x.id===id); if(i){ i.status=status; if(status==='Fixed') i.fixed=new Date().toISOString().slice(0,10); }
    toast('Status updated'); openDetail(id); render();
  }catch(e){ toast('Could not update'); }
}
async function setUrgency(id,urgency){
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'urgency',id:id,urgency:urgency})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    const i=issues.find(x=>x.id===id); if(i){ i.impact=urgency; }
    toast('Urgency updated'); openDetail(id); render();
  }catch(e){ toast('Could not update'); }
}
async function persistNotDupe(key){
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'notdupe',key:key,ids:String(key).split(',')})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    toast('Saved — won\u2019t show again');
  }catch(e){ toast('Hid it here, but couldn\u2019t save it'); }
}
async function markDuplicate(id, keep){
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'note',issueId:id,who:'',note:'Duplicate of '+keep.chair+' (same spot)'})});
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'status',id:id,status:'Fixed'})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    const i=issues.find(x=>x.id===id); if(i){ i.status='Fixed'; i.fixed=new Date().toISOString().slice(0,10); }
    toast('Closed as duplicate'); hide(); render();
  }catch(e){ toast('Could not update'); }
}
function openDeleteRequest(id){
  const i=issues.find(x=>x.id===id); if(!i) return;
  const notes=log.filter(n=>n.issueId===id).length;
  $('#sheet').innerHTML='<div class="grab"></div><h2 style="margin:0 0 4px">Delete this request?</h2>'+
    '<div class="hint"><b>'+esc(i.chair||'—')+'</b> · '+esc(i.office)+'<br>“'+esc(i.problem)+'”<br><br>'+
    'This permanently removes the request'+(notes>0?' and its '+notes+' work-log entr'+(notes===1?'y':'ies'):'')+'. It can\u2019t be undone — use it only for bad or mistaken requests.</div>'+
    '<div id="dd-err" class="gateerr" style="text-align:left"></div>'+
    '<button class="warn-btn" id="dd-yes" style="background:#b0384a">Delete permanently</button>'+
    '<button class="ghost-btn" id="dd-no">Cancel</button>';
  document.getElementById('dd-yes').onclick=()=>doDeleteRequest(id);
  document.getElementById('dd-no').onclick=()=>openDetail(id);
  show();
}
async function doDeleteRequest(id){
  const err=document.getElementById('dd-err'); const btn=document.getElementById('dd-yes'); btn.disabled=true; btn.textContent='Deleting…';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'deleterequest',id:id})});
    const d=await r.json(); if(d.error||d.ok===false) throw new Error(d.error||'Could not delete');
    issues=issues.filter(x=>x.id!==id); log=log.filter(n=>n.issueId!==id);
    toast('Request deleted'); hide(); render();
  }catch(e){ btn.disabled=false; btn.textContent='Delete permanently'; err.textContent=String(e.message||'Could not delete'); }
}
function addPartRow(num,qty){
  const wrap=document.getElementById('d-parts'); if(!wrap) return;
  const item=document.createElement('div'); item.className='partitem';
  const row=document.createElement('div'); row.className='partrow';
  const a=document.createElement('input'); a.className='pnum'; a.setAttribute('list','partlist'); a.placeholder='Part # (optional)'; if(num)a.value=num;
  const b=document.createElement('input'); b.className='pqty'; b.type='number'; b.min='1'; b.placeholder='Qty'; if(qty)b.value=qty;
  const x=document.createElement('button'); x.type='button'; x.className='prem'; x.setAttribute('aria-label','remove'); x.textContent='×';
  const meta=document.createElement('div'); meta.className='pmeta';
  function upd(){ const p=partByNumber(a.value.trim());
    if(p){ meta.innerHTML='<b>'+esc(p.name)+'</b> · '+(p.inStock===''?'—':p.inStock+' in stock')+(p.bin?' · bin '+esc(p.bin):''); meta.classList.remove('bad'); }
    else if(a.value.trim()){ meta.textContent='Not in the parts list'; meta.classList.add('bad'); }
    else { meta.textContent=''; meta.classList.remove('bad'); } }
  a.oninput=upd; a.onchange=upd;
  x.onclick=()=>{ item.remove(); if(!wrap.children.length) addPartRow(); };
  row.appendChild(a); row.appendChild(b); row.appendChild(x);
  item.appendChild(row); item.appendChild(meta); wrap.appendChild(item); upd();
}
function partByNumber(n){ return parts.find(p=>String(p.number)===String(n)); }

function notePhotos(nt){
  const list=(nt.photos&&nt.photos.length)?nt.photos:(nt.photo?[nt.photo]:[]);
  if(!list.length) return '';
  return '<div class="photorow">'+list.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img class="notephoto" src="'+esc(u)+'"></a>').join('')+'</div>';
}
function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); let w=img.naturalWidth,h=img.naturalHeight;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const durl=c.toDataURL('image/jpeg',quality);
      resolve({base64:durl.split(',')[1], type:'image/jpeg', name:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', dataUrl:durl}); };
    img.onerror=()=>reject(new Error('bad image')); img.src=url;
  });
}
const MAXPHOTOS=10;
function renderPhotoPreview(){
  const box=document.getElementById('d-photo'); if(!box) return;
  let h='';
  if(pendingPhotos.length){
    h+='<div class="photorow">'+pendingPhotos.map((p,ix)=>
      '<div class="photochip"><img src="'+p.dataUrl+'"><button type="button" class="d-photorm" data-ix="'+ix+'" aria-label="remove photo">\u00d7</button></div>').join('')+'</div>';
  }
  if(pendingPhotos.length<MAXPHOTOS){
    h+='<button type="button" class="addpart-btn" id="d-photobtn">+ add '+(pendingPhotos.length?'another photo':'a photo')+'</button>';
  }
  if(pendingPhotos.length>1) h+='<div class="photocount">'+pendingPhotos.length+' photos ready</div>';
  box.innerHTML=h;
  const btn=document.getElementById('d-photobtn');
  if(btn) btn.onclick=()=>document.getElementById('d-photofile').click();
  box.querySelectorAll('.d-photorm').forEach(b=>b.onclick=()=>{
    pendingPhotos.splice(Number(b.dataset.ix),1); renderPhotoPreview(); });
}

async function addNote(id){
  const who=readCrewChecks('d-who'), note=$('#d-note').value.trim();
  const used=[];
  document.querySelectorAll('#d-parts .partrow').forEach(r=>{
    const num=r.querySelector('.pnum').value.trim(); const q=Number(r.querySelector('.pqty').value);
    if(num) used.push({partNumber:num, qty:(q>0?q:0)});
  });
  if(!note && !used.length && !pendingPhotos.length){ $('#d-note').focus(); return; }
  $('#d-add').disabled=true; $('#d-add').textContent='Saving…';
  const payload={action:'note',issueId:id,who:who,note:note,parts:used};
  if(pendingPhotos.length){ payload.photos=pendingPhotos.map(p=>({base64:p.base64,type:p.type,name:p.name})); }
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    log.push({id:'tmp'+Date.now(),issueId:id,date:new Date().toISOString().slice(0,10),who:who,note:note,partNumber:used[0]?used[0].partNumber:'',qty:used[0]?used[0].qty:'',photos:pendingPhotos.map(p=>p.dataUrl),photo:pendingPhotos.length?pendingPhotos[0].dataUrl:''});
    let msg='Added to work log';
    if(d.parts&&d.parts.length){
      const ok=d.parts.filter(p=>p.matched), bad=d.parts.filter(p=>!p.matched);
      ok.forEach(p=>{ const pp=partByNumber(p.number); if(pp) pp.inStock=p.remaining; });
      if(ok.length===1) msg='Logged · '+ok[0].number+' now '+ok[0].remaining+' in stock';
      else if(ok.length>1) msg='Logged · '+ok.length+' parts updated';
      if(bad.length) msg+=' · '+bad.length+' not found';
    }
    if(d.photosFailed) msg+=' · '+d.photosFailed+' photo'+(d.photosFailed===1?'':'s')+' didn\u2019t attach';
    else if(d.photo===false && pendingPhotos.length) msg+=' · photo didn\u2019t attach';
    pendingPhotos=[];
    toast(msg); openDetail(id);
  }catch(e){ $('#d-add').disabled=false; $('#d-add').textContent='Add to work log'; toast('Could not save'); }
}
</script>
