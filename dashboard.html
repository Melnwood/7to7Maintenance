<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chair Check — Crew</title>
<style>
  :root{--primary:#0E7C86;--primary-press:#0a5f67;--blue:#66CCF6;--navy:#1E60A8;--ink:#14202b;--muted:#6b7a89;
    --line:#d9e1e7;--bg:#f4f7f8;--surface:#fff;--high:#E5484D;--med:#E8930C;--low:#8A97A4;--green:#1B7A43;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);}
  header{position:sticky;top:0;z-index:10;color:var(--ink);
    background:linear-gradient(180deg,#7FD6F8 0%,#66CCF6 55%,#57C2EF 100%);
    padding:calc(13px + env(safe-area-inset-top,0)) 16px 14px;box-shadow:0 4px 14px rgba(30,96,168,.16);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{background:#fff;border-radius:13px;padding:6px 10px;display:flex;align-items:center;box-shadow:0 2px 6px rgba(20,32,43,.18);flex:0 0 auto;}
  .brand .logo img{height:32px;display:block;}
  .brand h1{margin:0;font-size:1.18rem;font-weight:800;letter-spacing:-.01em;color:#0c2233;}
  .brand p{margin:2px 0 0;font-size:.74rem;font-weight:700;color:#0c2233;opacity:.74;display:flex;align-items:center;gap:6px;}
  .brand p::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(27,122,67,.18);flex:0 0 auto;}
  .tabs{display:flex;gap:5px;margin-top:14px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);
    border-radius:14px;padding:5px;box-shadow:0 2px 8px rgba(30,96,168,.12),inset 0 1px 1px rgba(255,255,255,.7);}
  .tabs button{flex:1;background:none;border:none;color:var(--navy);font-weight:800;font-size:.88rem;
    padding:10px 4px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;letter-spacing:.01em;}
  .tabs button:hover{background:rgba(255,255,255,.55);}
  .tabs button.on{background:var(--navy);color:#fff;box-shadow:0 2px 7px rgba(30,96,168,.4);}
  .tabs button.on:hover{background:var(--navy);}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 48px;}
  .stats{display:flex;gap:8px;margin-bottom:12px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;}
  .stat.on{border-bottom-color:var(--navy);background:#fbfdff;}
  .stat b{display:block;font-size:1.4rem;font-weight:800;line-height:1;}
  .stat span{font-size:.6rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
  .stat.dupe b{color:var(--high);}
  .hint{font-size:.74rem;color:var(--muted);margin:0 0 8px;}
  .board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .col{flex:0 0 240px;scroll-snap-align:start;background:#eef2f4;border-radius:12px;padding:9px;}
  @media(min-width:900px){ .col{flex:1 1 0;min-width:0;} .board{overflow-x:visible;} }
  .col .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px;}
  .col .ch .t{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);}
  .col .ch .n{font-size:.7rem;font-weight:800;background:#fff;border-radius:999px;padding:1px 8px;color:var(--muted);}
  .col .none{font-size:.78rem;color:var(--muted);text-align:center;padding:10px 0;}
  .kcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--low);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer;}
  .kcard.high{border-left-color:var(--high);} .kcard.medium{border-left-color:var(--med);}
  .kcard .l{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
  .kcard .chair{font-weight:800;font-size:.88rem;}
  .kcard .ag{font-size:.7rem;color:var(--muted);white-space:nowrap;} .kcard .ag.old{color:var(--high);font-weight:700;}
  .kcard .pr{font-size:.82rem;color:#39434d;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .kcard .off{font-size:.71rem;color:var(--muted);font-weight:700;margin-top:3px;}
  .kpill{font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto;}
  .kpill.high{background:#FDECEC;color:#C42B30;} .kpill.medium{background:#FDF1DD;color:#9A5E08;} .kpill.low{background:#EEF1F4;color:#48555F;}
  .kcard .off .oldtxt{color:var(--high);font-weight:800;}
  .sortrow{margin:2px 0 12px;}
  .seg{display:inline-flex;gap:4px;background:#e7edf0;border:1px solid var(--line);border-radius:11px;padding:4px;}
  .seg button{border:none;background:none;color:var(--navy);font-weight:800;font-size:.8rem;padding:7px 16px;border-radius:8px;cursor:pointer;}
  .seg button.on{background:var(--navy);color:#fff;}
  .col.high{background:#FBECEC;} .col.medium{background:#FBF1E4;} .col.low{background:#eef2f4;}
  .col.high .ch .t{color:#C42B30;} .col.medium .ch .t{color:#9A5E08;} .col.low .ch .t{color:#48555F;}
  .stag{display:inline-block;font-size:.62rem;font-weight:800;color:#0B5A62;background:#E4F1F2;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;}
  .dupbtn{display:inline-flex;align-items:center;gap:8px;background:#FDECEC;border:1px solid #f3b6b8;color:#9b2226;border-radius:999px;padding:8px 14px;font-weight:800;font-size:.86rem;cursor:pointer;margin-bottom:12px;}
  .dupwrap{background:var(--surface);border:1px solid #f3b6b8;border-radius:12px;padding:11px;margin-bottom:12px;}
  .dupwrap .h{font-weight:800;font-size:.86rem;color:#9b2226;margin-bottom:7px;}
  .r{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:6px;cursor:pointer;}
  .r .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--low);}
  .r .dot.high{background:var(--high);} .r .dot.medium{background:var(--med);}
  .r .loc{font-weight:800;font-size:.9rem;white-space:nowrap;}
  .r .pr{flex:1;font-size:.86rem;color:#39434d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:40px;}
  .r .ag{font-size:.72rem;color:var(--muted);white-space:nowrap;}
  .muted{color:var(--muted);font-size:.85rem;}
  .empty{text-align:center;color:var(--muted);padding:26px;}
  .dayhdr{font-size:.8rem;font-weight:800;margin:16px 0 7px;}
  .act{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:6px;cursor:pointer;}
  .act .adot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto;}
  .act .adot.Fixed{background:var(--green);} .act .adot.Reported{background:var(--navy);} .act .adot.Work{background:var(--med);}
  .act .b{font-weight:700;font-size:.88rem;} .act .s{font-size:.8rem;color:var(--muted);margin-top:1px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 12px;border-radius:999px;font-size:.84rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .cbadge{margin-left:6px;background:var(--line);color:var(--muted);border-radius:999px;padding:0 6px;font-size:.7rem;font-weight:800;}
  .chip.on .cbadge{background:rgba(255,255,255,.25);color:#fff;} .cbadge.hi{background:#FDECEC;color:#C42B30;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(20,32,43,.05);}
  .ogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:620px){ .ogrid{grid-template-columns:repeat(3,1fr);} }
  .ocard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s,transform .05s;}
  .ocard:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(30,96,168,.12);}
  .ocard:active{transform:scale(.99);}
  .ocard .nm{font-weight:800;font-size:.96rem;color:var(--ink);}
  .ocard .ct{font-size:.74rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
  .ocard .ct .d{width:7px;height:7px;border-radius:50%;background:var(--low);}
  .ocard .ct .d.hi{background:var(--high);}
  .ocard.clear .ct{color:var(--green);}
  .backbtn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--navy);font-weight:800;font-size:.9rem;cursor:pointer;padding:4px 2px;margin-bottom:6px;}
  .ohead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .ohead .nm{font-size:1.08rem;font-weight:800;}
  .pill{display:inline-block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:999px;}
  .pill.high{background:#FDECEC;color:#C42B30;} .pill.medium{background:#FDF1DD;color:#9A5E08;} .pill.low{background:#EEF1F4;color:#48555F;}
  .hist{font-size:.82rem;color:#48555f;background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;}
  .age{font-size:.78rem;color:var(--muted);}
  .scrim{position:fixed;inset:0;background:rgba(20,32,43,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0));max-height:92vh;overflow:auto;transform:translateY(100%);transition:.25s;max-width:880px;margin:0 auto;}
  .sheet.show{transform:translateY(0);}
  .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px;}
  .statusgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:6px 0 4px;}
  .statusgrid button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 6px;font-weight:700;font-size:.84rem;cursor:pointer;}
  .statusgrid button.sel{background:var(--navy);color:#fff;border-color:var(--navy);}
  label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 5px;}
  input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px;font-size:1rem;font-family:inherit;color:var(--ink);background:var(--surface);}
  textarea{min-height:64px;resize:vertical;}
  .twocol{display:flex;gap:8px;} .twocol>div{flex:1;}
  .partrow{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .partrow .pnum{flex:1;min-width:0;} .partrow .pqty{width:72px;flex:0 0 auto;}
  .partrow .prem{flex:0 0 auto;width:40px;border:1.5px solid var(--line);background:#fff;border-radius:10px;color:var(--muted);font-size:1.15rem;font-weight:800;cursor:pointer;line-height:1;padding:9px 0;}
  .addpart-btn{margin-top:8px;background:none;border:none;color:var(--navy);font-weight:800;font-size:.86rem;cursor:pointer;padding:4px 2px;}
  .partitem{margin-top:8px;} .partitem .partrow{margin-top:0;}
  .pmeta{font-size:.76rem;color:var(--muted);margin:4px 2px 0;}
  .pmeta b{color:var(--ink);font-weight:800;} .pmeta.bad{color:var(--high);}
  .photochip{position:relative;display:inline-block;margin-top:4px;}
  .photochip img{height:96px;border-radius:10px;border:1px solid var(--line);display:block;object-fit:cover;}
  .photochip button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-weight:800;cursor:pointer;line-height:1;}
  .notephoto{margin-top:6px;max-height:130px;border-radius:8px;border:1px solid var(--line);display:block;}
  .primary-btn{width:100%;margin-top:14px;background:var(--primary);color:#fff;border:none;border-radius:13px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;}
  .warn-btn{width:100%;margin-top:8px;background:#fff;border:1.5px solid var(--high);color:#C42B30;border-radius:13px;padding:12px;font-weight:800;cursor:pointer;}
  .ghost-btn{width:100%;margin-top:8px;background:none;border:none;color:var(--muted);padding:11px;font-weight:700;cursor:pointer;}
  .note{font-size:.84rem;color:#48555f;background:var(--bg);border-radius:9px;padding:8px 10px;margin-top:6px;}
  .note .d{font-size:.7rem;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:60;}
  .toast.show{opacity:1;}
</style>
</head>

    <div><h1>Chair Check — Crew</h1><p id="sub">Loading…</p></div>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="board" class="on">Request</button>
    <button data-t="recent">Recent</button>
    <button data-t="offices">Offices</button>
  </div>
</header>
<div class="wrap" id="wrap"><div class="muted">Loading…</div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const OFFICES=['Alamo Ranch','Braun','Bulverde','Cibolo','Forum','Leon Springs','Mission Oaks','Potranco','Sahota','Singing Hills','Stone Oak','TPC'];
const CREW=['Adrian Ellenwood','Maintenance Tech 1','Maintenance Tech 2'];
const STATUSES=['New','In progress','Pending','Part ordered','Fixed'];
const FLOW=['New','In progress','Pending','Part ordered'];
const PRILABEL={high:'High',medium:'Medium',low:'Low'};
const API='/.netlify/functions/airtable';
const $=s=>document.querySelector(s);
const rank={high:0,medium:1,low:2,'':3};
const MS=86400000;
let issues=[], log=[], parts=[], tab='board', filter='open', selOffice=null, sortMode='priority';
let pendingPhoto=null;
let dismissed={}, showDupes=false, showOfficeDupes=false;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900);}
function dObj(s){ if(!s) return null; const x=new Date(s+'T00:00'); return isNaN(x)?null:x; }
function today0(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function daysAgo(s){ const d=dObj(s); return d?Math.round((today0()-d)/MS):null; }
function fmt(s){ const d=dObj(s); return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''; }
function ageStr(n){ if(n==null) return ''; if(n<=0) return 'today'; return n+'d'; }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function isOpen(i){ return i.status!=='Fixed'; }
function byOldest(a,b){ return (daysAgo(b.date)||0)-(daysAgo(a.date)||0); }

function normChair(s){ return String(s||'').toLowerCase()
  .replace(/\b(rooms?|rm)\b/g,'rm').replace(/\b(operatory|ops?)\b/g,'op').replace(/\b(hygiene|hyg|h)\b/g,'hyg')
  .replace(/[^a-z0-9]/g,''); }
function clustersIn(list){
  const groups={};
  list.filter(isOpen).forEach(i=>{ const nc=normChair(i.chair); if(!nc) return; const k=i.office+'|'+nc; (groups[k]=groups[k]||[]).push(i); });
  return Object.keys(groups).map(k=>groups[k]).filter(g=>g.length>=2 && !dismissed[g.map(x=>x.id).sort().join(',')]);
}

load();
async function load(){
  try{ const r=await fetch(API); const d=await r.json(); if(d.error) throw new Error(d.error);
    issues=d.issues||[]; log=d.worklog||[]; parts=d.parts||[]; render();
  }catch(e){ $('#wrap').innerHTML='<div class="empty">Could not load.<br><span class="muted">'+esc(e.message||'')+'</span></div>'; }
}
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; showDupes=false; selOffice=null; showOfficeDupes=false;
  $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(); });

function render(){
  try{
    const open=issues.filter(isOpen);
    const high=open.filter(i=>i.impact==='high');
    const parts=open.filter(i=>i.status==='Part ordered');
    const dupes=clustersIn(issues); let dupeCount=0; dupes.forEach(g=>dupeCount+=g.length);
    $('#sub').textContent=open.length+' open · '+high.length+' high';
    let body='';
    if(tab==='board') body=viewBoard(open,high,parts,dupes,dupeCount);
    else if(tab==='recent') body=viewRecent();
    else body=viewOffices();
    $('#wrap').innerHTML=body; wire();
  }catch(e){ $('#wrap').innerHTML='<div class="empty">Something went wrong drawing this view.<br><span class="muted">'+esc(e.message||'')+'</span></div>'; }
}

function statTile(key,n,label,cls){ return '<div class="stat'+(filter===key&&!showDupes?' on':'')+(key==='dupes'&&showDupes?' on':'')+(cls?' '+cls:'')+'" data-f="'+key+'"><b>'+n+'</b><span>'+label+'</span></div>'; }

function viewBoard(open,high,parts,dupes,dupeCount){
  let h='<div class="stats">'+
    statTile('open',open.length,'Open')+statTile('high',high.length,'High')+
    statTile('part',parts.length,'On parts')+statTile('dupes',dupeCount,'Dupes','dupe')+'</div>';
  if(showDupes){ return h+dupeSection(dupes,'across all offices'); }
  let pool=open;
  if(filter==='high') pool=high;
  if(filter==='part') pool=parts;
  h+=sortToggle();
  if(sortMode==='priority'){ h+=boardHint('priority'); h+=priorityColumns(pool); }
  else { h+=boardHint('date'); h+=kanban(pool, filter==='part'?['Part ordered']:FLOW); }
  return h;
}
function sortToggle(){
  return '<div class="sortrow"><div class="seg">'+
    '<button class="'+(sortMode==='priority'?'on':'')+'" data-sort="priority">Priority</button>'+
    '<button class="'+(sortMode==='date'?'on':'')+'" data-sort="date">Date</button></div></div>';
}
function boardHint(mode){
  return '<div class="hint">'+(mode==='priority'
    ? 'By priority — swipe across High · Medium · Low.'
    : 'By status — swipe across New → In progress → Pending → Part ordered.')+'</div>';
}
function priorityColumns(list){
  const order=[['high','High'],['medium','Medium'],['low','Low']];
  let h='<div class="board">';
  order.forEach(pair=>{ const key=pair[0], label=pair[1];
    const items=list.filter(i=>(i.impact||'')===key).sort(byOldest);
    h+='<div class="col '+key+'"><div class="ch"><span class="t">'+label+'</span><span class="n">'+items.length+'</span></div>';
    if(items.length) items.forEach(i=>h+=kcard(i,true)); else h+='<div class="none">—</div>';
    h+='</div>';
  });
  const none=list.filter(i=>!i.impact);
  if(none.length){ h+='<div class="col"><div class="ch"><span class="t">No priority</span><span class="n">'+none.length+'</span></div>';
    none.sort(byOldest).forEach(i=>h+=kcard(i,true)); h+='</div>'; }
  h+='</div>';
  return h;
}

function kanban(list,statuses){
  let h='<div class="board">';
  statuses.forEach(st=>{
    const items=list.filter(i=>i.status===st).sort(byOldest);
    h+='<div class="col"><div class="ch"><span class="t">'+st+'</span><span class="n">'+items.length+'</span></div>';
    if(items.length) items.forEach(i=>h+=kcard(i)); else h+='<div class="none">—</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}
function kcard(i,showStatus){
  const n=daysAgo(i.date); const old=n!=null&&n>=14;
  const pri=(i.impact&&PRILABEL[i.impact])?'<span class="kpill '+i.impact+'">'+PRILABEL[i.impact]+'</span>':'';
  const stag=showStatus?'<span class="stag">'+esc(i.status)+'</span>':'';
  const ageHtml=(n!=null)?' · <span'+(old?' class="oldtxt"':'')+'>'+ageStr(n)+'</span>':'';
  return '<div class="kcard '+(i.impact||'')+'" data-id="'+i.id+'">'+
    '<div class="l"><span class="chair">'+esc(i.chair||'—')+stag+'</span>'+pri+'</div>'+
    '<div class="pr">'+esc(i.problem)+'</div>'+
    '<div class="off">'+esc(i.office)+(i.date?' · submitted '+fmt(i.date):'')+ageHtml+'</div></div>';
}

function dupeSection(clusters,scope){
  if(!clusters.length) return '<div class="empty">No possible duplicates '+esc(scope)+'. 👍</div>';
  let h='<div class="muted" style="margin-bottom:10px">Same office &amp; same chair/area, both still open. Open one to resolve, or dismiss if they are really different.</div>';
  clusters.forEach(g=>{ const key=g.map(x=>x.id).sort().join(',');
    h+='<div class="dupwrap"><div class="h">'+esc(g[0].office)+' · '+esc(g[0].chair)+' — '+g.length+' open reports</div>';
    g.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(i=>h+=dupRow(i));
    h+='<button class="ghost-btn" data-dismiss="'+key+'">Not duplicates — dismiss</button></div>'; });
  return h;
}
function dupRow(i){ const n=daysAgo(i.date);
  return '<div class="r" data-id="'+i.id+'"><span class="dot '+(i.impact||'')+'"></span>'+
    '<span class="loc">'+esc(i.chair||'—')+'</span><span class="pr">'+esc(i.problem)+'</span>'+
    '<span class="ag">'+ageStr(n)+'</span></div>'; }

function viewRecent(){
  const ev=[];
  issues.forEach(i=>{ if(i.fixed) ev.push({date:i.fixed,kind:'Fixed',i}); if(i.date) ev.push({date:i.date,kind:'Reported',i}); });
  log.forEach(w=>{ if(w.date&&(w.note||w.partNumber)){ const i=issues.find(x=>x.id===w.issueId); ev.push({date:w.date,kind:'Work',w,i}); } });
  ev.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const top=ev.slice(0,50); if(!top.length) return '<div class="empty">No activity yet.</div>';
  let h='',last='';
  top.forEach(e=>{ const lab=dayLabel(e.date); if(lab!==last){ h+='<div class="dayhdr">'+lab+'</div>'; last=lab; } h+=actRow(e); });
  return h;
}
function dayLabel(s){ const n=daysAgo(s); if(n===0)return'Today'; if(n===1)return'Yesterday'; const d=dObj(s); return d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):s; }
function actRow(e){ const i=e.i,id=i?i.id:''; let b='',s='';
  if(e.kind==='Fixed'){ b='Fixed · '+(i?esc(i.chair||'')+' '+esc(i.office):''); s=i?esc(i.problem):''; }
  else if(e.kind==='Reported'){ b='New report · '+(i?esc(i.chair||'')+' '+esc(i.office):''); s=i?esc(i.problem):''; }
  else { b='Work logged'+(e.w.who?' · '+esc(e.w.who):'')+(i?' · '+esc(i.office):''); s=esc(e.w.note||('Used part '+e.w.partNumber)); }
  return '<div class="act" data-id="'+id+'"><span class="adot '+e.kind+'"></span><div><div class="b">'+b+'</div><div class="s">'+s+'</div></div></div>'; }

function viewOffices(){
  const open=issues.filter(isOpen);
  if(!selOffice){
    const byOff={},hiOff={};
    open.forEach(i=>{ byOff[i.office]=(byOff[i.office]||0)+1; if(i.impact==='high')hiOff[i.office]=true; });
    let h='<div class="hint">Pick an office to see its board.</div><div class="panel"><div class="ogrid">';
    OFFICES.forEach(o=>{ const n=byOff[o]||0;
      h+='<button class="ocard'+(n?'':' clear')+'" data-o="'+o+'"><span class="nm">'+o+'</span>'+
         '<span class="ct">'+(n?('<span class="d'+(hiOff[o]?' hi':'')+'"></span>'+n+' open'+(hiOff[o]?' · high':'')):'all clear')+'</span></button>';
    });
    h+='</div></div>';
    return h;
  }
  const mine=issues.filter(i=>i.office===selOffice);
  const ongoing=mine.filter(isOpen);
  const oClusters=clustersIn(mine); let oCount=0; oClusters.forEach(g=>oCount+=g.length);
  let h='<button class="backbtn" data-back="1">‹ All offices</button>';
  h+='<div class="ohead"><span class="nm">'+esc(selOffice)+'</span><span class="muted">'+ongoing.length+' ongoing</span></div>';
  if(oCount){ h+='<div class="dupbtn" data-officedupes="1">⚠︎ '+oCount+' possible duplicates here — '+(showOfficeDupes?'hide':'review')+'</div>'; }
  if(showOfficeDupes && oCount){ h+=dupeSection(oClusters, 'at '+selOffice); }
  if(!ongoing.length){ h+='<div class="empty">Nothing open at '+esc(selOffice)+'. 🎉</div>'; return h; }
  h+=sortToggle();
  if(sortMode==='priority'){ h+=boardHint('priority'); h+=priorityColumns(ongoing); }
  else { h+=boardHint('date'); h+=kanban(ongoing,FLOW); }
  return h;
}

function wire(){
  $('#wrap').querySelectorAll('[data-id]').forEach(c=>{ if(c.dataset.id) c.onclick=()=>openDetail(c.dataset.id); });
  $('#wrap').querySelectorAll('[data-f]').forEach(c=>c.onclick=(e)=>{ e.stopPropagation(); const f=c.dataset.f;
    if(f==='dupes'){ showDupes=!showDupes; } else { showDupes=false; filter=f; }
    render(); });
  $('#wrap').querySelectorAll('[data-sort]').forEach(c=>c.onclick=()=>{ sortMode=c.dataset.sort; render(); });
  $('#wrap').querySelectorAll('[data-o]').forEach(c=>c.onclick=()=>{ selOffice=c.dataset.o; showOfficeDupes=false; render(); });
  $('#wrap').querySelectorAll('[data-back]').forEach(c=>c.onclick=()=>{ selOffice=null; showOfficeDupes=false; render(); });
  $('#wrap').querySelectorAll('[data-officedupes]').forEach(c=>c.onclick=()=>{ showOfficeDupes=!showOfficeDupes; render(); });
  $('#wrap').querySelectorAll('[data-dismiss]').forEach(c=>c.onclick=(e)=>{ e.stopPropagation(); dismissed[c.dataset.dismiss]=true; render(); });
}

function show(){$('#scrim').classList.add('show');$('#sheet').classList.add('show');}
function hide(){$('#scrim').classList.remove('show');$('#sheet').classList.remove('show');}
$('#scrim').onclick=hide;

function openDetail(id){
  const i=issues.find(x=>x.id===id); if(!i)return;
  const notes=log.filter(n=>n.issueId===id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const n=daysAgo(i.date);
  const twins=issues.filter(x=>x.id!==id && isOpen(x) && x.office===i.office && normChair(x.chair)===normChair(i.chair) && normChair(i.chair));
  $('#sheet').innerHTML='<div class="grab"></div>'+
    '<h2 style="margin:0 0 4px">'+esc(i.chair||'—')+' <span style="color:var(--muted);font-size:.9rem;font-weight:700">'+esc(i.office)+'</span></h2>'+
    '<div class="muted" style="margin-bottom:8px">'+esc(i.problem)+'</div>'+
    (i.impact?'<span class="pill '+i.impact+'">'+i.impact+'</span> ':'')+
    '<span class="age">reported '+fmt(i.date)+(n>0?' · '+n+'d ago':'')+(i.reporter?' · by '+esc(i.reporter):'')+'</span>'+
    (twins.length?'<div class="dupbtn" style="margin-top:10px" id="d-twin">⚠︎ '+twins.length+' other open report'+(twins.length>1?'s':'')+' for this spot — view</div>':'')+
    '<label>Status</label><div class="statusgrid" id="d-status">'+STATUSES.map(s=>'<button class="'+(s===i.status?'sel':'')+'" data-s="'+s+'">'+s+'</button>').join('')+'</div>'+
    (i.history?'<label>History (from the logs)</label><div class="hist">'+esc(i.history)+'</div>':'')+
    '<label>Work log</label><div>'+(notes.length?notes.map(nt=>'<div class="note"><div class="d">'+fmt(nt.date)+(nt.who?' · '+esc(nt.who):'')+(nt.partNumber?' · part '+esc(nt.partNumber)+(nt.qty?' ×'+nt.qty:''):'')+'</div>'+esc(nt.note)+(nt.photo?'<img class="notephoto" src="'+esc(nt.photo)+'">':'')+'</div>').join(''):'<div class="note" style="color:var(--muted)">No work logged here yet</div>')+'</div>'+
    '<label>Log work done</label>'+
    '<select id="d-who"><option value="">Who did the work?</option>'+CREW.map(c=>'<option>'+c+'</option>').join('')+'</select>'+
    '<textarea id="d-note" placeholder="What did you do?" style="margin-top:8px"></textarea>'+
    '<label>Parts used</label><div id="d-parts"></div>'+
    '<button type="button" class="addpart-btn" id="d-addpart">+ add another part</button>'+
    '<datalist id="partlist">'+parts.map(p=>'<option value="'+esc(p.number)+'">'+esc(p.number)+' — '+esc(p.name)+(p.bin?' ('+esc(p.bin)+')':'')+'</option>').join('')+'</datalist>'+
    '<label>Photo</label><div id="d-photo"></div>'+
    '<input id="d-photofile" type="file" accept="image/*" style="display:none">'+
    '<button class="primary-btn" id="d-add">Add to work log</button>'+
    (twins.length?'<button class="warn-btn" id="d-dup">Mark this one a duplicate (close it)</button>':'')+
    '<button class="ghost-btn" id="d-close">Done</button>';
  $('#d-status').querySelectorAll('button').forEach(b=>b.onclick=()=>setStatus(id,b.dataset.s));
  $('#d-add').onclick=()=>addNote(id);
  document.getElementById('d-parts').innerHTML=''; addPartRow();
  document.getElementById('d-addpart').onclick=()=>addPartRow();
  pendingPhoto=null; renderPhotoPreview();
  document.getElementById('d-photofile').onchange=async(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{ pendingPhoto=await compressImage(f,1280,0.7); }catch(err){ pendingPhoto=null; toast('Could not read that photo'); }
    renderPhotoPreview(); e.target.value=''; };
  $('#d-close').onclick=hide;
  if(twins.length){ $('#d-twin').onclick=()=>openDetail(twins[0].id); $('#d-dup').onclick=()=>markDuplicate(id, twins[0]); }
  show();
}

async function setStatus(id,status){
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'status',id:id,status:status})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    const i=issues.find(x=>x.id===id); if(i){ i.status=status; if(status==='Fixed') i.fixed=new Date().toISOString().slice(0,10); }
    toast('Status updated'); openDetail(id); render();
  }catch(e){ toast('Could not update'); }
}
async function markDuplicate(id, keep){
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'note',issueId:id,who:'',note:'Duplicate of '+keep.chair+' (same spot)'})});
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'status',id:id,status:'Fixed'})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    const i=issues.find(x=>x.id===id); if(i){ i.status='Fixed'; i.fixed=new Date().toISOString().slice(0,10); }
    toast('Closed as duplicate'); hide(); render();
  }catch(e){ toast('Could not update'); }
}
function addPartRow(num,qty){
  const wrap=document.getElementById('d-parts'); if(!wrap) return;
  const item=document.createElement('div'); item.className='partitem';
  const row=document.createElement('div'); row.className='partrow';
  const a=document.createElement('input'); a.className='pnum'; a.setAttribute('list','partlist'); a.placeholder='Part # (optional)'; if(num)a.value=num;
  const b=document.createElement('input'); b.className='pqty'; b.type='number'; b.min='1'; b.placeholder='Qty'; if(qty)b.value=qty;
  const x=document.createElement('button'); x.type='button'; x.className='prem'; x.setAttribute('aria-label','remove'); x.textContent='×';
  const meta=document.createElement('div'); meta.className='pmeta';
  function upd(){ const p=partByNumber(a.value.trim());
    if(p){ meta.innerHTML='<b>'+esc(p.name)+'</b> · '+(p.inStock===''?'—':p.inStock+' in stock')+(p.bin?' · bin '+esc(p.bin):''); meta.classList.remove('bad'); }
    else if(a.value.trim()){ meta.textContent='Not in the parts list'; meta.classList.add('bad'); }
    else { meta.textContent=''; meta.classList.remove('bad'); } }
  a.oninput=upd; a.onchange=upd;
  x.onclick=()=>{ item.remove(); if(!wrap.children.length) addPartRow(); };
  row.appendChild(a); row.appendChild(b); row.appendChild(x);
  item.appendChild(row); item.appendChild(meta); wrap.appendChild(item); upd();
}
function partByNumber(n){ return parts.find(p=>String(p.number)===String(n)); }

function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); let w=img.naturalWidth,h=img.naturalHeight;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const durl=c.toDataURL('image/jpeg',quality);
      resolve({base64:durl.split(',')[1], type:'image/jpeg', name:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', dataUrl:durl}); };
    img.onerror=()=>reject(new Error('bad image')); img.src=url;
  });
}
function renderPhotoPreview(){
  const box=document.getElementById('d-photo'); if(!box) return;
  if(pendingPhoto){ box.innerHTML='<div class="photochip"><img src="'+pendingPhoto.dataUrl+'"><button type="button" id="d-photorm" aria-label="remove photo">×</button></div>';
    document.getElementById('d-photorm').onclick=()=>{ pendingPhoto=null; renderPhotoPreview(); }; }
  else { box.innerHTML='<button type="button" class="addpart-btn" id="d-photobtn">+ add a photo</button>';
    document.getElementById('d-photobtn').onclick=()=>document.getElementById('d-photofile').click(); }
}

async function addNote(id){
  const who=$('#d-who').value, note=$('#d-note').value.trim();
  const used=[];
  document.querySelectorAll('#d-parts .partrow').forEach(r=>{
    const num=r.querySelector('.pnum').value.trim(); const q=Number(r.querySelector('.pqty').value);
    if(num) used.push({partNumber:num, qty:(q>0?q:0)});
  });
  if(!note && !used.length && !pendingPhoto){ $('#d-note').focus(); return; }
  $('#d-add').disabled=true; $('#d-add').textContent='Saving…';
  const payload={action:'note',issueId:id,who:who,note:note,parts:used};
  if(pendingPhoto){ payload.photo=pendingPhoto.base64; payload.photoType=pendingPhoto.type; payload.photoName=pendingPhoto.name; }
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    const d=await r.json(); if(d.error) throw new Error(d.error);
    log.push({id:'tmp'+Date.now(),issueId:id,date:new Date().toISOString().slice(0,10),who:who,note:note,partNumber:used[0]?used[0].partNumber:'',qty:used[0]?used[0].qty:'',photo:pendingPhoto?pendingPhoto.dataUrl:''});
    let msg='Added to work log';
    if(d.parts&&d.parts.length){
      const ok=d.parts.filter(p=>p.matched), bad=d.parts.filter(p=>!p.matched);
      ok.forEach(p=>{ const pp=partByNumber(p.number); if(pp) pp.inStock=p.remaining; });
      if(ok.length===1) msg='Logged · '+ok[0].number+' now '+ok[0].remaining+' in stock';
      else if(ok.length>1) msg='Logged · '+ok.length+' parts updated';
      if(bad.length) msg+=' · '+bad.length+' not found';
    }
    if(d.photo===false) msg+=' · photo didn\u2019t attach';
    pendingPhoto=null;
    toast(msg); openDetail(id);
  }catch(e){ $('#d-add').disabled=false; $('#d-add').textContent='Add to work log'; toast('Could not save'); }
}
