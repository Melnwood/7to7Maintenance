<title>Chair Check — Report a problem</title>
<style>
  :root{--primary:#0E7C86;--primary-press:#0a5f67;--ink:#14202b;--muted:#6b7a89;
    --line:#d9e1e7;--bg:#f4f7f8;--surface:#fff;--high:#E5484D;--med:#E8930C;--low:#8A97A4;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);}
  header{position:sticky;top:0;z-index:10;background:#66CCF6;color:#14202b;
    padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;box-shadow:0 2px 10px rgba(102,204,246,.45);}
  header h1{margin:0;font-size:1.15rem;font-weight:800;}
  header p{margin:2px 0 0;font-size:.78rem;opacity:.9;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{background:#fff;border-radius:12px;padding:5px 9px;display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15);flex:0 0 auto;}
  .brand .logo img{height:30px;display:block;}
  .wrap{max-width:640px;margin:0 auto;padding:16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  h2{font-size:1rem;margin:0 0 12px;}
  label{display:block;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:12px 0 5px;}
  input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;
    font-size:1rem;font-family:inherit;color:var(--ink);background:var(--surface);}
  textarea{min-height:80px;resize:vertical;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:12px;padding:13px 6px;font-weight:800;font-size:.9rem;cursor:pointer;}
  .seg button.high.sel{background:#FDECEC;border-color:var(--high);color:#C42B30;}
  .seg button.medium.sel{background:#FDF1DD;border-color:var(--med);color:#9A5E08;}
  .seg button.low.sel{background:#EEF1F4;border-color:var(--low);color:#48555F;}
  .primary-btn{width:100%;margin-top:18px;background:var(--primary);color:#fff;border:none;
    border-radius:14px;padding:16px;font-size:1.05rem;font-weight:800;cursor:pointer;}
  .primary-btn:disabled{opacity:.5;}
  .primary-btn:active{background:var(--primary-press);}
  .opt{color:var(--muted);font-weight:600;font-size:.8rem;}
  .thanks{position:fixed;inset:0;background:rgba(20,32,43,.5);display:none;align-items:center;justify-content:center;padding:22px;z-index:100;}
  .thanks.show{display:flex;}
  .tbubble{background:#66CCF6;border-radius:26px;padding:22px 20px 15px;max-width:360px;width:100%;box-shadow:0 16px 44px rgba(20,32,43,.4);animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .theads{display:flex;align-items:center;gap:10px;}
  .thead{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;}
  .tavatar{height:94px;display:flex;align-items:flex-end;justify-content:center;}
  .tavatar img{height:94px;width:auto;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(20,32,43,.28));}
  .tavatar.flip img{transform:scaleX(-1);}
  .tavatar svg{height:84px;width:auto;opacity:.5;}
  #face-adrian, #face-adrian img{height:112px;}
  .tmsg{flex:1;text-align:center;font-weight:800;font-size:.98rem;line-height:1.32;color:#0b3a6b;transition:opacity .18s ease;}
  .thead span{font-weight:800;font-size:.72rem;color:#0b3a6b;}
  .tclose{text-align:center;margin-top:13px;font-size:.72rem;font-weight:700;color:#0b3a6b;opacity:.7;}
  .ver{max-width:560px;margin:2px auto 18px;text-align:center;color:var(--muted);font-size:.68rem;opacity:.7;}
  .addphoto{width:100%;border:1.5px dashed var(--line);background:var(--surface);color:var(--muted);border-radius:12px;padding:12px;font-weight:700;font-size:.92rem;cursor:pointer;}
  .photochip{position:relative;display:inline-block;margin-top:2px;}
  .photochip img{height:120px;border-radius:12px;border:1px solid var(--line);display:block;object-fit:cover;}
  .photochip button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-weight:800;cursor:pointer;line-height:1;}
  .issue{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .issue .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .issue .loc{font-weight:800;}
  .issue .desc{font-size:.9rem;margin:4px 0 8px;}
  .pill{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    padding:3px 9px;border-radius:999px;}
  .pill.high{background:#FDECEC;color:#C42B30;} .pill.medium{background:#FDF1DD;color:#9A5E08;}
  .pill.low{background:#EEF1F4;color:#48555F;}
  .status{font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:999px;background:#EEF3F4;color:#0B5A62;}
  .status.Fixed{background:#E5F5EA;color:#1B7A43;}
  .muted{color:var(--muted);font-size:.85rem;}
  .note{font-size:.82rem;color:#48555f;background:var(--bg);border-radius:8px;padding:7px 9px;margin-top:6px;}
  .upd{display:flex;gap:8px;align-items:flex-start;background:#eef6ff;border:1px solid #cfe2f7;border-radius:9px;padding:8px 10px;margin:6px 0 10px;font-size:.83rem;color:#1d4e7a;}
  .upd .ic{flex:0 0 auto;}
  .upd .ux{flex:1;min-width:0;} .upd .ux b{color:#143a5c;} .upd .ud{color:#5a7d9e;font-size:.74rem;margin-top:2px;}
  .newinfo{display:inline-block;background:#E5484D;color:#fff;font-size:.62rem;font-weight:800;border-radius:999px;padding:2px 7px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em;vertical-align:middle;}
  .critnote{margin-top:8px;font-size:.8rem;font-weight:700;color:#9a2a2e;background:#FFF6F6;border:1px solid #f3c9cb;border-radius:9px;padding:8px 10px;}
  .empty{text-align:center;color:var(--muted);padding:24px;}
  .sechdr{display:flex;align-items:center;gap:8px;margin:14px 0 6px;}
  .sechdr .t{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;}
  .sechdr .n{font-size:.7rem;font-weight:800;color:var(--muted);background:var(--line);border-radius:999px;padding:1px 8px;}
  .r{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:6px;cursor:pointer;}
  .r .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--low);}
  .r .dot.high{background:var(--high);} .r .dot.medium{background:var(--med);}
  .r .loc{font-weight:800;font-size:.9rem;white-space:nowrap;}
  .r .pr{flex:1;font-size:.86rem;color:#39434d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:30px;}
  .r .ag{font-size:.72rem;color:var(--muted);white-space:nowrap;}
  .rdet{font-size:.82rem;color:#48555f;background:var(--bg);border-radius:8px;padding:9px 11px;margin:-2px 0 8px;white-space:pre-wrap;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:50;}
  .toast.show{opacity:1;}
  .chooser button{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);
    border-radius:12px;padding:14px;margin-bottom:8px;font-size:1rem;font-weight:700;cursor:pointer;}
</style>

<script>
const OFFICES_FALLBACK=['Alamo Ranch','Braun','Bulverde','Cibolo','Forum','Leon Springs','Mission Oaks','Potranco','Sahota','Singing Hills','Stone Oak','TPC'];
let OFFICES=OFFICES_FALLBACK.slice();
const API='/.netlify/functions/airtable';
const $=s=>document.querySelector(s);
function qs(k){return new URLSearchParams(location.search).get(k)||'';}
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800);}
const THANKS_MSGS=[
  "Got it \u2014 thanks! Keeping your office running is what we love to do. We\u2019ll take good care of this one.",
  "Thanks for letting us know! Adrian and Jack are on it \u2014 we\u2019ll get you taken care of.",
  "Message received! Even Grumpy\u2019s smiling about this one. We\u2019ll get it handled \u2014 thanks for trusting us with it.",
  "Thank you! We genuinely love taking care of you and your team. Consider it handled.",
  "Thanks for sending this over! Taking care of your office is the best part of our job \u2014 we\u2019ve got it from here.",
  "You got it! Nothing makes our day like keeping your office humming. We\u2019re on it.",
  "Thanks so much! We\u2019ll roll up our sleeves and take care of this one for you.",
  "Appreciate you flagging it! Adrian and Jack will get this sorted \u2014 you\u2019re in good hands.",
  "Consider it on our list! Serving your team is exactly why we do what we do. Thank you!",
  "Thanks a bunch! We\u2019ll be by to make it right \u2014 keeping you up and running is our favorite thing."
];
let lastMsgIdx=-1;
function showThanks(count){
  const n=THANKS_MSGS.length;
  let idx;
  if(typeof count==='number' && count>0){ idx=(count-1)%n; }          // global: advances one per request
  else { idx=(lastMsgIdx+1)%n; }                                       // fallback: step locally
  lastMsgIdx=idx;
  const el=document.getElementById('tmsg'); if(el) el.textContent=THANKS_MSGS[idx];
  $('#thanks').classList.add('show');
}
function hideThanks(){ $('#thanks').classList.remove('show'); }
$('#thanks').onclick=hideThanks;
function fmt(d){if(!d)return'';const x=new Date(d+'T00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

let office=qs('office');
let draft={chair:'',problem:'',impact:'',reporter:''};
let pendingPhoto=null;
const AUTO_HIGH=/(compressor|vacuum|\bvac\b|autoclave|sterilizer|steriliz)/i;

// Any office named in the URL is valid — this is how brand-new offices get a working report page.
if(office){ boot(); } else { renderChooser(); }

function renderChooser(){
  $('#sub').textContent='Pick your office';
  $('#app').innerHTML='<div class="card chooser"><h2>Which office is this?</h2><div id="chooserlist">'+
    OFFICES.map(o=>`<button onclick="pick('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')+'</div></div>';
  // refresh the chooser with the live office list (includes any newly added offices)
  fetch(API).then(r=>r.json()).then(d=>{ if(d&&d.officeList&&d.officeList.length){ OFFICES=d.officeList.slice();
    const el=document.getElementById('chooserlist'); if(el) el.innerHTML=OFFICES.map(o=>`<button onclick="pick('${o.replace(/'/g,"\\'")}')">${o}</button>`).join(''); } }).catch(()=>{});
}
function pick(o){ location.search='?office='+encodeURIComponent(o); }

async function boot(){
  $('#sub').textContent=office+' · report or check status';
  render();
  load();
}

function render(){
  $('#app').innerHTML=`
    <div class="card">
      <h2>Report a problem — ${office}</h2>
      <label>Your name *</label>
      <input id="f-name" placeholder="Who's reporting this?">
      <label>Chair / area *</label>
      <input id="f-chair" placeholder="e.g. Op 4, Sterile, Pano — where is it?">
      <label>What's wrong? *</label>
      <textarea id="f-desc" placeholder="Describe what isn't working"></textarea>
      <label>How urgent?</label>
      <div class="seg" id="f-impact">
        <button class="high" data-v="high">High</button>
        <button class="medium" data-v="medium">Medium</button>
        <button class="low" data-v="low">Low</button>
      </div>
      <div id="crit-note" class="critnote" style="display:none">⚠ Critical equipment — this will be sent as <b>High</b> priority.</div>
      <label>Photo <span class="opt">(optional)</span></label>
      <div id="f-photo"></div>
      <input id="f-photofile" type="file" accept="image/*" style="display:none">
      <button class="primary-btn" id="submit" disabled>Submit report</button>
    </div>
    <div class="card">
      <h2>Ongoing requests — ${office} <span id="list-count" class="muted" style="font-weight:600;font-size:.8rem"></span></h2>
      <div id="list"><div class="muted">Loading…</div></div>
    </div>`;
  $('#f-name').oninput=$('#f-chair').oninput=$('#f-desc').oninput=sync;
  $('#f-impact').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const critical=AUTO_HIGH.test((draft.problem||'')+' '+(draft.chair||''));
    draft.impact = critical ? 'high' : b.dataset.v;
    $('#f-impact').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x.dataset.v===draft.impact));
    sync();
  });
  renderPhoto();
  $('#f-photofile').onchange=async(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{ pendingPhoto=await compressImage(f,1280,0.7); }catch(err){ pendingPhoto=null; toast('Could not read that photo'); }
    renderPhoto(); e.target.value=''; };
  $('#submit').onclick=submit;
}
function renderPhoto(){
  const box=$('#f-photo'); if(!box) return;
  if(pendingPhoto){ box.innerHTML='<div class="photochip"><img src="'+pendingPhoto.dataUrl+'"><button type="button" id="f-photorm" aria-label="remove photo">×</button></div>';
    $('#f-photorm').onclick=()=>{ pendingPhoto=null; renderPhoto(); }; }
  else { box.innerHTML='<button type="button" class="addphoto" id="f-photobtn">+ add a photo</button>';
    $('#f-photobtn').onclick=()=>$('#f-photofile').click(); }
}
function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); let w=img.naturalWidth,h=img.naturalHeight;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const durl=c.toDataURL('image/jpeg',quality);
      resolve({base64:durl.split(',')[1], type:'image/jpeg', name:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', dataUrl:durl}); };
    img.onerror=()=>reject(new Error('bad image')); img.src=url;
  });
}
function sync(){
  draft.reporter=$('#f-name').value.trim();
  draft.chair=$('#f-chair').value.trim();
  draft.problem=$('#f-desc').value.trim();
  const critical=AUTO_HIGH.test((draft.problem||'')+' '+(draft.chair||''));
  const note=$('#crit-note');
  if(critical){
    draft.impact='high';
    $('#f-impact').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x.dataset.v==='high'));
    if(note) note.style.display='block';
  } else if(note){ note.style.display='none'; }
  $('#submit').disabled=!(draft.reporter && draft.chair && draft.problem && draft.impact);
}

async function load(){
  try{
    const r=await fetch(API+'?office='+encodeURIComponent(office));
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    renderList(d.issues||[], d.worklog||[]);
  }catch(e){ $('#list').innerHTML='<div class="muted">Could not load right now. Pull to refresh in a moment.</div>'; }
}

function renderList(issues, log){
  const FLOW=['New','In progress','Pending','Part ordered'];
  const ongoing=issues.filter(i=>i.status!=='Fixed');
  const cnt=document.getElementById('list-count');
  if(cnt) cnt.textContent='('+ongoing.length+(ongoing.length===1?' open)':' open)');
  if(!ongoing.length){ $('#list').innerHTML='<div class="empty">All clear — nothing ongoing right now.</div>'; return; }
  const rankm={high:0,medium:1,low:2,'':3};
  let h='';
  FLOW.forEach(st=>{
    const list=ongoing.filter(i=>i.status===st).sort((a,b)=>(rankm[a.impact]-rankm[b.impact])||(b.date||'').localeCompare(a.date||''));
    if(!list.length) return;
    h+='<div class="sechdr"><span class="t">'+st+'</span><span class="n">'+list.length+'</span></div>';
    list.forEach(i=>{
      const n=daysAgo(i.date);
      const notes=log.filter(x=>x.issueId===i.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      // crew updates = real typed notes (skip filler + auto status rows)
      const crew=notes.filter(x=>x.note && !/^\(same job\)/i.test(x.note) && !/^status changed/i.test(x.note) && !/\[dupe-key:/i.test(x.note) && !/not a duplicate/i.test(x.note));
      const lastCrew=crew[crew.length-1];
      const histLine = i.history ? String(i.history).split('\n').map(x=>x.trim()).filter(Boolean).pop() : '';
      const det = 'Reported '+fmt(i.date)+(i.reporter?' by '+i.reporter:'')+
        (crew.length?('\n\nUpdates:\n'+crew.map(c=>'• '+(c.date?fmt(c.date)+' — ':'')+c.note).join('\n')):(histLine?('\n'+histLine):''));
      let updStrip='';
      if(lastCrew){
        const fresh = daysAgo(lastCrew.date); const isNew = (fresh!=null && fresh<=2);
        updStrip='<div class="upd"><span class="ic">🛠</span><span class="ux"><b>Update from maintenance:</b> '+
          esc(lastCrew.note)+(isNew?'<span class="newinfo">New info</span>':'')+
          '<div class="ud">'+(lastCrew.date?fmt(lastCrew.date):'')+(crew.length>1?' · tap to see all updates':'')+'</div></span></div>';
      }
      h+='<div class="r" data-id="'+i.id+'"><span class="dot '+(i.impact||'')+'"></span>'+
         '<span class="loc">'+esc(i.chair||'—')+'</span>'+
         '<span class="pr">'+esc(i.problem)+'</span>'+
         '<span class="ag">'+(n==null?'':(n<=0?'today':n+'d'))+'</span></div>'+
         updStrip+
         '<div class="rdet" id="det-'+i.id+'" style="display:none">'+det.replace(/</g,'&lt;')+'</div>';
    });
  });
  $('#list').innerHTML=h;
  $('#list').querySelectorAll('.r').forEach(r=>r.onclick=()=>{
    const d=document.getElementById('det-'+r.dataset.id);
    if(d) d.style.display = d.style.display==='none' ? 'block' : 'none';
  });
}
function daysAgo(s){ if(!s) return null; const x=new Date(s+'T00:00'); if(isNaN(x)) return null;
  const t=new Date(); const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return Math.round((t0-x)/86400000); }

async function submit(){
  if($('#submit').disabled) return;
  $('#submit').disabled=true; $('#submit').textContent='Sending…';
  try{
    const payload={action:'add',office:office,chair:draft.chair,problem:draft.problem,impact:draft.impact,reporter:draft.reporter};
    if(pendingPhoto){ payload.photo=pendingPhoto.base64; payload.photoType=pendingPhoto.type; payload.photoName=pendingPhoto.name; }
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    showThanks(d.count);
    pendingPhoto=null;
    draft={chair:'',problem:'',impact:'',reporter:draft.reporter};
    render(); $('#f-name').value=draft.reporter; sync(); load();
  }catch(e){
    $('#submit').textContent='Submit report'; $('#submit').disabled=false;
    toast('Could not send — try again');
  }
}
</script>
